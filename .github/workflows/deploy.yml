name: Deploy Dev

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: flowlee-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: https://dev.api.flowlee.com
          VITE_AUTH_AUTHORITY: https://flowlee.eu.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ vars.DEV_AUTH_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.flowlee.com

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - run: aws s3 sync dist/ s3://flowlee-dev-frontend-assets --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?DomainName=='flowlee-dev-frontend-assets.s3.eu-central-1.amazonaws.com']].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
