name: Deploy Dev

on:
  push:
    branches: [main]

env:
  DOMAIN: dev.flowlee.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: flowlee-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # --- ACM Certificate (us-east-1, idempotent) ---
      - name: Ensure ACM certificate exists
        id: cert
        run: |
          # Check if a cert already exists for this domain
          CERT_ARN=$(aws acm list-certificates --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]" \
            --output text)

          if [ "$CERT_ARN" = "None" ] || [ -z "$CERT_ARN" ]; then
            echo "Requesting new certificate for ${DOMAIN}..."
            CERT_ARN=$(aws acm request-certificate --region us-east-1 \
              --domain-name "${DOMAIN}" \
              --validation-method DNS \
              --query "CertificateArn" --output text)
            echo "Certificate requested: $CERT_ARN"
            sleep 5
          else
            echo "Certificate already exists: $CERT_ARN"
          fi

          echo "arn=$CERT_ARN" >> "$GITHUB_OUTPUT"

      - name: Log DNS validation records
        run: |
          echo "=== ACM DNS Validation Records ==="
          echo "Add these CNAME records to GoDaddy to validate the certificate:"
          echo ""
          aws acm describe-certificate --region us-east-1 \
            --certificate-arn ${{ steps.cert.outputs.arn }} \
            --query "Certificate.DomainValidationOptions[].ResourceRecord" \
            --output table
          echo ""
          echo "=== Waiting for certificate validation... ==="

      - name: Wait for certificate validation
        run: |
          aws acm wait certificate-validated --region us-east-1 \
            --certificate-arn ${{ steps.cert.outputs.arn }}
          echo "Certificate validated!"

      # --- Deploy infrastructure ---
      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Deploy CDK stack
        run: |
          npx cdk deploy --require-approval never \
            --outputs-file cdk-outputs.json \
            -c certificateArn=${{ steps.cert.outputs.arn }}
        working-directory: infra

      - name: Extract stack outputs
        id: outputs
        run: |
          STACK_NAME="FlowleeFrontend-dev"
          BUCKET=$(jq -r ".[\"$STACK_NAME\"].BucketName" infra/cdk-outputs.json)
          DIST_ID=$(jq -r ".[\"$STACK_NAME\"].DistributionId" infra/cdk-outputs.json)
          DIST_DOMAIN=$(jq -r ".[\"$STACK_NAME\"].DistributionDomainName" infra/cdk-outputs.json)
          FRONTEND_DOMAIN=$(jq -r ".[\"$STACK_NAME\"].FrontendDomain" infra/cdk-outputs.json)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$DIST_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "frontend_domain=$FRONTEND_DOMAIN" >> "$GITHUB_OUTPUT"

      # --- Build frontend ---
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dev.api.flowlee.com
          VITE_AUTH_AUTHORITY: https://flowlee.eu.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ vars.DEV_AUTH_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.flowlee.com

      # --- Deploy assets ---
      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ steps.outputs.outputs.bucket }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.distribution_id }} --paths "/*"

      # --- Summary: where to point DNS ---
      - name: Output DNS configuration
        run: |
          echo "## DNS Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Point your domain to CloudFront:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Domain | Record Type | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ steps.outputs.outputs.frontend_domain }} | CNAME | ${{ steps.outputs.outputs.distribution_domain }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
