openapi: 3.0.3
info:
  title: Flowlee API
  version: '0.1.0'
  description: |
    ## Signup Flow

    A new user first registers an identity with the Auth0_Tenant (Auth0's
    hosted registration experience), entirely outside the scope of the
    Flowlee API's own HTTP routes. Once that identity exists, the user
    calls `POST /api/users` to create their `UserProfile` record, using the
    `sub` claim from their Auth0 access token as the `userId` value stored
    on that record.

    Separately, an organization admin calls
    `POST /api/orgs/{orgId}/team-members` to add the new user to an
    organization as a `TeamMember`. Because `POST /api/orgs/{orgId}/team-members`
    does not verify that a `UserProfile` already exists for the target
    `userId`, these two steps — creating the `UserProfile` and creating the
    `TeamMember` — may happen in either order, or independently of one
    another.

    ### Known Limitation: Org Provisioning Gap

    No HTTP route in this API currently triggers Auth0 `app_metadata`
    provisioning of the `org_id` and `role` values for a newly added
    `TeamMember`. Adding a `TeamMember` record via
    `POST /api/orgs/{orgId}/team-members` does not, by itself, cause Auth0
    to start including matching `https://flowlee.com/org_id` and
    `https://flowlee.com/role` custom claims in that user's future access
    tokens — a `provisionOrganization` helper capable of performing this
    provisioning exists in `packages/auth0-client`, but no route documented
    in this contract invokes it. Until this gap is closed, that
    provisioning step must be performed outside the documented HTTP API.

    ## Signin Flow

    A registered user obtains an Auth0 access token by completing the
    Authorization Code flow directly against the Auth0_Tenant, outside the
    scope of the Flowlee API's own HTTP routes. The resulting token's `sub`
    claim is the canonical `userId` used to identify the caller across
    every domain Lambda in this API — `Identity_Lambda`,
    `Project_Domain_Lambda`, `Documents_Lambda`, `Folders_Documents_Lambda`,
    `Gallery_Lambda`, `Chat_Messages_Lambda`, and `Permissions_Lambda`
    alike.

    For any org-scoped route — one whose path includes an `{orgId}` path
    parameter — the caller's access token must additionally carry an
    `org_id` claim and a `role` claim that match, respectively, the `orgId`
    field and the `role` field of a `TeamMember` record whose `userId`
    field matches the token's `sub` claim. If the token's signature and
    audience are otherwise valid but no such `TeamMember` record exists,
    the downstream domain Lambda — not the gateway authorizer — returns an
    HTTP 403 error for that org-scoped route, since organization membership
    is enforced by handler-level access rules rather than by the
    authorizer.
servers:
  - url: https://dev.api.flowlee.com
  - url: https://test.api.flowlee.com
  - url: https://preprod.api.flowlee.com
  - url: https://api.flowlee.com
security:
  - bearerAuth: []
tags:
  - name: Chat Messages
    description: >-
      The 6 ConversationSession and ChatMessage routes served by
      Chat_Messages_Lambda, covering the AI assistant's conversation
      history.
    x-lambda: Chat_Messages_Lambda
  - name: Identity
    description: >-
      The 9 UserProfile and TeamMember routes served by Identity_Lambda,
      covering user profile management and organization membership.
    x-lambda: Identity_Lambda
  - name: Projects
    description: >-
      The 6 Project routes, including share-token issuance, served by
      Project_Domain_Lambda.
    x-lambda: Project_Domain_Lambda
  - name: Timeline Blocks
    description: >-
      The 5 TimelineBlock routes served by Project_Domain_Lambda.
    x-lambda: Project_Domain_Lambda
  - name: Clients
    description: >-
      The 5 Client routes served by Project_Domain_Lambda, including
      internal-client and duplicate-name constraints.
    x-lambda: Project_Domain_Lambda
  - name: Milestones and Tasks
    description: >-
      The 13 Milestone, Task, Comment, and attachment routes served by
      Project_Domain_Lambda.
    x-lambda: Project_Domain_Lambda
  - name: Insights
    description: >-
      The 6 read-only project and team reporting routes served by
      Project_Domain_Lambda.
    x-lambda: Project_Domain_Lambda
  - name: Documents (Project-Scoped)
    description: >-
      The 6 project-scoped Document routes served by Documents_Lambda,
      including signed-URL issuance.
    x-lambda: Documents_Lambda
  - name: Folders and Hierarchy Documents
    description: >-
      The 11 Folder and org-scoped HierarchyDocument routes served by
      Folders_Documents_Lambda, including soft-delete and restore.
    x-lambda: Folders_Documents_Lambda
  - name: Gallery
    description: >-
      The 6 GalleryImage routes served by Gallery_Lambda.
    x-lambda: Gallery_Lambda
  - name: Permissions
    description: >-
      The 8 permission grant, effective-permission, my-access, and
      share-link routes served by Permissions_Lambda.
    x-lambda: Permissions_Lambda
  - name: Public Sharing
    description: >-
      The single unauthenticated Public_Sharing_Route served by
      Project_Domain_Lambda.
    x-lambda: Project_Domain_Lambda
paths:
  /api/chat-sessions:
    get:
      operationId: listChatSessions
      summary: List the caller's chat sessions
      description: >-
        Returns every ConversationSession owned by the caller. Results are
        inherently scoped to the caller's own userId by the underlying
        query, so this operation has no ownership-failure case and never
        returns a 403 response for another user's sessions
        (Requirement 9.6).
      tags:
        - Chat Messages
      responses:
        '200':
          description: The caller's chat sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSession'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/chat-sessions/{sessionId}:
    get:
      operationId: getChatSession
      summary: Get a chat session and its messages
      description: >-
        Returns the ConversationSession identified by sessionId, including
        its messages ordered from oldest to newest, but only when the
        caller's userId matches the session's ownerUserId. A sessionId
        that does not exist and a sessionId owned by another user both
        yield an indistinguishable 403 response; this route never returns
        404 for a missing or unowned session (Requirement 9.5).
      tags:
        - Chat Messages
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The chat session and its messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteChatSession
      summary: Delete a chat session
      description: >-
        Permanently deletes the ConversationSession identified by
        sessionId and all of its messages, but only when the caller's
        userId matches the session's ownerUserId. A sessionId that does
        not exist and a sessionId owned by another user both yield an
        indistinguishable 403 response; this route never returns 404 for
        a missing or unowned session (Requirement 9.5). Returns 204 with
        no response body on success (Requirement 9.1).
      tags:
        - Chat Messages
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '204':
          description: >-
            No Content. The chat session and all of its messages were
            deleted.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/chat-sessions/{sessionId}/messages:
    post:
      operationId: createChatMessage
      summary: Create a chat message in a session
      description: >-
        Appends a new ChatMessage to the ConversationSession identified by
        sessionId, but only when the caller's userId matches the session's
        ownerUserId. A sessionId that does not exist and a sessionId owned
        by another user both yield an indistinguishable 403 response; this
        route never returns 404 for a missing or unowned session
        (Requirement 9.5). Returns 201 with the created ChatMessage on
        success (Requirement 9.2).
      tags:
        - Chat Messages
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
      responses:
        '201':
          description: The created chat message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listChatMessages
      summary: List messages in a chat session
      description: >-
        Returns every ChatMessage belonging to the ConversationSession
        identified by sessionId, ordered from oldest to newest
        (Requirement 9.3), but only when the caller's userId matches the
        session's ownerUserId. A sessionId that does not exist and a
        sessionId owned by another user both yield an indistinguishable
        403 response; this route never returns 404 for a missing or
        unowned session (Requirement 9.5).
      tags:
        - Chat Messages
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: >-
            The session's chat messages, ordered from oldest to newest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/chat-sessions/{sessionId}/messages/{messageId}:
    get:
      operationId: getChatMessage
      summary: Get a single chat message
      description: >-
        Returns the ChatMessage identified by messageId within the
        ConversationSession identified by sessionId, but only when the
        caller's userId matches the session's ownerUserId. A sessionId
        that does not exist and a sessionId owned by another user both
        yield an indistinguishable 403 response, never 404
        (Requirement 9.5). Separately, if sessionId is owned by the
        caller but messageId does not exist within that session, this
        route returns 404 (Requirement 9.4) — the one Chat Messages
        operation with both a 403 case (missing or foreign sessionId) and
        a 404 case (missing messageId within an owned session).
      tags:
        - Chat Messages
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/MessageIdParam'
      responses:
        '200':
          description: The chat message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/users:
    post:
      operationId: createUserProfile
      summary: Create or overwrite the caller's user profile
      description: >-
        Creates the UserProfile record for the given userId, using the
        Auth0 `sub` claim as the canonical userId (Requirement 4.2).
        Restricted to the caller acting on their own userId; a request
        whose userId does not match the caller's own `sub` claim returns
        an HTTP 403 Error_Envelope (Requirement 4.5, 5.4). A request for
        a userId that already has a UserProfile record unconditionally
        overwrites that record and returns HTTP 201, never HTTP 409
        (Requirement 4.6, 5.1). This route has no ordering dependency
        with `POST /api/orgs/{orgId}/team-members` — either may be
        called before, after, or independently of the other
        (Requirement 4.7).
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201':
          description: The created (or overwritten) user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/users/{userId}:
    get:
      operationId: getUserProfile
      summary: Get a user's profile
      description: >-
        Returns the UserProfile identified by userId. This profile-scoped
        route is restricted to the caller acting on their own userId; a
        request for any other userId returns an HTTP 403 Error_Envelope
        (Requirement 5.4). Returns HTTP 404 if no UserProfile record
        exists for userId (Requirement 5.7).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: The user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateUserProfile
      summary: Update a user's profile
      description: >-
        Updates the UserProfile identified by userId. Restricted to the
        caller acting on their own userId; a request for any other
        userId returns an HTTP 403 Error_Envelope (Requirement 5.4).
        Returns HTTP 404 if no UserProfile record exists for userId
        (Requirement 5.7), and HTTP 400 if the request body is missing a
        required field or fails schema validation, leaving the existing
        record unchanged (Requirement 5.8).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteUserProfile
      summary: Delete a user's profile
      description: >-
        Deletes the UserProfile identified by userId. Restricted to the
        caller acting on their own userId; a request for any other
        userId returns an HTTP 403 Error_Envelope (Requirement 5.4).
        Returns HTTP 404 if no UserProfile record exists for userId
        (Requirement 5.7).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: No Content. The user profile was deleted.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/users/{userId}/photo/presign:
    post:
      operationId: presignProfilePhotoUpload
      summary: Presign an S3 upload URL for a profile photo
      description: >-
        Generates a presigned S3 PUT URL for uploading a profile photo,
        served by Identity_Lambda. Restricted to the caller acting on
        their own userId; a request for any other userId returns an HTTP
        403 Error_Envelope. Returns HTTP 400 if contentType is not one of
        the supported image types, or if sizeBytes is not a positive
        integer or exceeds 10,485,760 bytes (10MB). On success, returns
        the photoId, S3 key, presigned upload URL, and metadata.
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignProfilePhotoUploadRequest'
      responses:
        '200':
          description: The presigned upload URL and photo metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignProfilePhotoUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orgs/{orgId}/team-members:
    post:
      operationId: createTeamMember
      summary: Add a user to an organization as a team member
      description: >-
        Creates a TeamMember record linking userId to orgId — the flow
        by which an existing admin adds a new user to an organization
        (Requirement 4.3). Restricted to callers whose token `role`
        claim is admin within orgId; otherwise returns an HTTP 403
        Error_Envelope (Requirement 5.5). A request for a userId that
        already exists as a team member of orgId unconditionally
        overwrites the existing TeamMember record and returns HTTP 201,
        never HTTP 409 (Requirement 5.2). This route does not verify
        that a UserProfile record already exists for the target userId,
        so it has no ordering dependency with `POST /api/users` — either
        may be called before, after, or independently of the other
        (Requirement 4.7).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamMemberRequest'
      responses:
        '201':
          description: The created (or overwritten) team member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listTeamMembers
      summary: List an organization's team members
      description: >-
        Returns every TeamMember of the organization identified by
        orgId. Restricted to callers who are members of orgId; no admin
        role is required (Requirement 5.6). Otherwise returns an HTTP
        403 Error_Envelope.
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
      responses:
        '200':
          description: The organization's team members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orgs/{orgId}/team-members/{userId}:
    get:
      operationId: getTeamMember
      summary: Get a single team member
      description: >-
        Returns the TeamMember identified by userId within the
        organization identified by orgId. Restricted to callers who are
        members of orgId; no admin role is required (Requirement 5.6).
        Otherwise returns an HTTP 403 Error_Envelope. Returns HTTP 404
        if no TeamMember record exists for userId within orgId, or if
        orgId does not exist (Requirement 5.7).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: The team member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateTeamMember
      summary: Update a team member
      description: >-
        Updates the TeamMember identified by userId within the
        organization identified by orgId. Restricted to callers whose
        token `role` claim is admin within orgId; otherwise returns an
        HTTP 403 Error_Envelope (Requirement 5.5). Returns HTTP 404 if
        no TeamMember record exists for userId within orgId, or if
        orgId does not exist (Requirement 5.7), and HTTP 400 if the
        request body is missing a required field or fails schema
        validation, leaving the existing record unchanged (Requirement
        5.8).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
      responses:
        '200':
          description: The updated team member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTeamMember
      summary: Remove a team member
      description: >-
        Removes the TeamMember identified by userId within the
        organization identified by orgId. Restricted to callers whose
        token `role` claim is admin within orgId; otherwise returns an
        HTTP 403 Error_Envelope (Requirement 5.5). Returns HTTP 404 if
        no TeamMember record exists for userId within orgId, or if
        orgId does not exist (Requirement 5.7).
      tags:
        - Identity
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: No Content. The team member was removed.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orgs/{orgId}/projects:
    post:
      operationId: createProject
      summary: Create a project within an organization
      description: >-
        Creates a Project record scoped to orgId, along with a default
        "General" Milestone and a matching project folder (with a
        "Task Attachments" subfolder) in the organization's folder
        hierarchy. Restricted to callers who are members of orgId; no
        admin role is required to create a project (Requirement 6.1) —
        the handler enforces org membership only. Otherwise returns an
        HTTP 403 Error_Envelope. Returns HTTP 400 if the request body is
        missing a required field or contains an invalid value.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listProjects
      summary: List an organization's projects
      description: >-
        Returns every Project scoped to orgId. Restricted to callers who
        are members of orgId; no admin role is required to list projects
        (Requirement 6.1) — the handler enforces org membership only.
        Otherwise returns an HTTP 403 Error_Envelope.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
      responses:
        '200':
          description: The organization's projects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orgs/{orgId}/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a single project
      description: >-
        Returns the Project identified by projectId within the
        organization identified by orgId. Restricted to callers who are
        members of orgId; no admin role is required to view a project
        (Requirement 6.1) — the handler enforces org membership only.
        Otherwise returns an HTTP 403 Error_Envelope. Returns HTTP 404 if
        no Project record exists for projectId within orgId.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateProject
      summary: Update a project
      description: >-
        Updates the Project identified by projectId within the
        organization identified by orgId. Restricted to callers who are
        members of orgId AND whose token role claim is admin within
        orgId; otherwise returns an HTTP 403 Error_Envelope (Requirement
        6.1). Returns HTTP 404 if no Project record exists for projectId
        within orgId, and HTTP 400 if the request body is missing a
        required field or contains a field value that fails schema
        validation.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: >-
        Deletes the Project identified by projectId within the
        organization identified by orgId. Restricted to callers who are
        members of orgId AND whose token role claim is admin within
        orgId; otherwise returns an HTTP 403 Error_Envelope (Requirement
        6.1). Returns HTTP 404 if no Project record exists for projectId
        within orgId.
