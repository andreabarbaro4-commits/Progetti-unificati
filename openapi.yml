        - Milestones and Tasks
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/MilestoneIdParam'
      responses:
        '200':
          description: The documents attached to tasks within the milestone.
          content:
            application/json:
              schema:
                type: object
                required:
                  - documents
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      description: >-
                        A task-to-document attachment join item. No
                        dedicated component schema exists for this shape
                        (Requirement 6.6).
                      required:
                        - taskId
                        - documentId
                        - projectId
                        - attachedBy
                        - attachedAt
                      properties:
                        taskId:
                          type: string
                          description: >-
                            The unique identifier of the task the
                            document is attached to.
                        documentId:
                          type: string
                          description: >-
                            The unique identifier of the attached
                            project-scoped Document.
                        projectId:
                          type: string
                          description: >-
                            The unique identifier of the project the
                            task belongs to.
                        attachedBy:
                          type: string
                          description: >-
                            The unique identifier of the user who
                            created the attachment.
                        attachedAt:
                          type: string
                          format: date-time
                          description: >-
                            The ISO 8601 timestamp at which the
                            attachment was created.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/tasks:
