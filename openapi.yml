  /api/projects/{projectId}/documents:
    post:
      operationId: createDocument
      summary: Create a project-scoped document record
      description: >-
        Creates a Document record scoped to projectId, served by the
        deprecated Documents_Lambda (Requirement 7.1). Every response
        from this operation — success or error alike — includes the
        Deprecation, Sunset, and Link headers described below,
        signaling migration to the `/api/folders` and
        `/api/documents/presign` successor routes; only this
        operation's success response documents the headers schema
        below for brevity, but they are present on every status code
        this operation can return. Access is checked via
        assertProjectAccess: if projectId does not resolve to any
        Project record, this operation returns HTTP 404 (Project not
        found) BEFORE any organization-membership check runs; if
        projectId does resolve but the caller is not a member of that
        project's organization, this operation returns HTTP 403 —
        distinct from the documentId-scoped 404 used by the other five
        operations in this tag, since POST has no documentId path
        parameter. Returns HTTP 400 if the request body is missing a
        required field, contains an invalid value, or supplies a
        documentId that already exists for this project (a
        client-supplied-identifier collision, deliberately modeled as
        400 rather than 409 — see CreateDocumentRequest).
      tags:
        - Documents (Project-Scoped)
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: The created document.
          headers:
            Deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
            Link:
              $ref: '#/components/headers/LinkHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
