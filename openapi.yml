  /api/projects/{projectId}/documents/{documentId}/signed-url:
    get:
      operationId: getDocumentSignedUrl
      summary: Get a signed CloudFront URL for a project-scoped document
      description: >-
        Returns a time-limited, CloudFront-signed URL for downloading
        the Document identified by documentId within the project
        identified by projectId, served by the deprecated
        Documents_Lambda (Requirement 7.1). The returned
        expiresInSeconds value is a fixed constant of 900 (15 minutes),
        set by CLOUDFRONT_SIGNED_URL_EXPIRES_IN_SECONDS in
        signed-url.ts; it does not vary per request, per document, or
        per project. Every response from this operation — success or
        error alike — includes the Deprecation, Sunset, and Link
        headers described below; only this operation's success
        response documents the headers schema below for brevity, but
        they are present on every status code this operation can
        return. Two distinct 404 checks apply, in order: first,
        assertProjectAccess returns HTTP 404 (Project not found) if
        projectId does not resolve to any Project record, BEFORE any
        organization-membership check runs; then, once projectId is
        confirmed to exist, a second and separate HTTP 404 (Document
        not found) is returned if documentId does not exist within
        that project. A caller who is not a member of the project's
        organization receives HTTP 403 instead of either 404 case.
      tags:
        - Documents (Project-Scoped)
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/DocumentIdParam'
      responses:
        '200':
          description: >-
            The signed URL and its expiration, in seconds from time of
            issuance.
          headers:
            Deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
            Link:
              $ref: '#/components/headers/LinkHeader'
          content:
            application/json:
              schema:
                type: object
                required:
                  - signedUrl
                  - expiresInSeconds
                properties:
                  signedUrl:
                    type: string
                    description: >-
                      The CloudFront-signed URL from which the
                      document's file may be downloaded until it
                      expires.
                  expiresInSeconds:
                    type: integer
                    description: >-
                      The number of seconds after issuance until
                      signedUrl expires. Always exactly 900 (15
                      minutes) — a fixed constant, not a per-request,
                      per-document, or per-project value.
                    example: 900
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/folders:
    post:
      operationId: createFolder
      summary: Create a folder
      description: >-
        Creates a new Folder record, served by Folders_Documents_Lambda
        (Requirement 7.2). orgId is derived from the caller's own access
        token, never from the request body. When the request's parentId
        is non-null, the caller must hold edit PermissionLevel on that
        parent folder, or the request returns an HTTP 403 Error_Envelope
        (Requirement 7.6); no permission check is performed when
        parentId is omitted or null, since the new folder is then
        created at the root of the organization's hierarchy. Returns
        HTTP 400 if name is missing or not a non-empty string. This
        operation references no existing entity by id, so no 404 case
        applies.
      tags:
        - Folders and Hierarchy Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: The created folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/folders/{id}:
    get:
      operationId: getFolder
      summary: Get a single folder
      description: >-
        Returns the Folder identified by id, served by
        Folders_Documents_Lambda (Requirement 7.2). Unusually for this
        domain, the existence check runs BEFORE the permission check on
        this operation: it returns an HTTP 404 Error_Envelope if no
        Folder record exists for id, or if the Folder exists but has
        already been soft-deleted (its deletedAt is set) — a
        soft-deleted folder is treated identically to a nonexistent one
        here. Only once the folder is confirmed to exist and not be
        soft-deleted does the handler check that the caller holds view
        PermissionLevel on id, returning an HTTP 403 Error_Envelope
        otherwise (Requirement 7.6).
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateFolder
      summary: Update or move a folder
      description: >-
        Updates the Folder identified by id, served by
        Folders_Documents_Lambda (Requirement 7.2). Unlike getFolder,
        this operation checks the caller's edit PermissionLevel on id
        FIRST — returning an HTTP 403 Error_Envelope before any
        existence check runs — and only then looks up the folder,
        returning an HTTP 404 Error_Envelope if no Folder record exists
        for id or if it has already been soft-deleted. All request body
        fields are optional; only fields provided are updated. When
        parentId is provided and differs from the folder's current
        parentId (a move), the caller must additionally hold edit
        PermissionLevel on the new, non-null parentId, returning HTTP
        403 otherwise, and the move is rejected with an HTTP 400
        Error_Envelope ("Cannot move a folder into its own subtree") if
        the new parentId is id itself or one of id's own descendants.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
      responses:
        '200':
          description: The updated folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteFolder
      summary: Soft-delete a folder and cascade to its descendants
      description: >-
        Soft-deletes the Folder identified by id by setting its
        deletedAt timestamp, served by Folders_Documents_Lambda
        (Requirement 7.2, 7.4). Requires the caller to hold edit
        PermissionLevel on id, returning an HTTP 403 Error_Envelope
        otherwise (Requirement 7.6); the permission check runs before
        the existence check, which returns an HTTP 404 Error_Envelope if
        no Folder record exists for id or if it is already
        soft-deleted. On success, the soft-delete cascades
        breadth-first to every descendant folder and HierarchyDocument
        beneath id, setting deletedAt on each not-already-deleted
        descendant. Reversible via `POST /api/folders/{id}/restore`.
        Unlike most delete operations in this contract, this operation
        returns HTTP 200 with a `{deleted: true}` body rather than HTTP
        204 with no body.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '200':
          description: >-
            The folder, and all of its descendants, were soft-deleted.
            Note this operation returns HTTP 200, not HTTP 204, and
            includes a response body — a deliberate deviation from the
            204-no-content pattern used by most other delete operations
            in this contract.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
                    example: true
                    description: Always true on a successful soft delete.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/folders/{id}/children:
    get:
      operationId: listFolderChildren
      summary: List a folder's direct children
      description: >-
        Returns the direct children of the Folder identified by id,
        served by Folders_Documents_Lambda (Requirement 7.2). Children
        may be either Folder or HierarchyDocument records, since a
        folder's direct children can be subfolders or files;
        already-soft-deleted children are excluded from the result.
        Requires the caller to hold view PermissionLevel on id,
        returning an HTTP 403 Error_Envelope otherwise (Requirement
        7.6). No separate existence check runs before the permission
        check on this operation, so a nonexistent id does not produce a
        distinct 404 response here — permission resolution runs first,
        and the subsequent child query for a nonexistent parent id
        simply returns an empty children array.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '200':
          description: The folder's direct children.
          content:
            application/json:
              schema:
                type: object
                required:
                  - children
                properties:
                  children:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Folder'
                        - $ref: '#/components/schemas/HierarchyDocument'
                      description: >-
                        A Folder (identifiable by its folderId field) or
                        a HierarchyDocument (identifiable by its
                        documentId field).
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/folders/{id}/restore:
    post:
      operationId: restoreFolder
      summary: Restore a soft-deleted folder
      description: >-
        Clears the deletedAt timestamp of the soft-deleted Folder
        identified by id, served by Folders_Documents_Lambda
        (Requirement 7.2). Requires the caller to hold edit
        PermissionLevel on id, returning an HTTP 403 Error_Envelope
        otherwise (Requirement 7.6); the permission check runs before
        the existence check, which returns an HTTP 404 Error_Envelope if
        no Folder record exists for id. Returns an HTTP 400
        Error_Envelope ("Folder is not deleted") if the folder identified
        by id is not currently soft-deleted. Returns an HTTP 409
        Error_Envelope ("Parent is still deleted. Restore must happen
        top-down.") if the folder's own parentId refers to a Folder that
        is itself still soft-deleted — restores must happen top-down
        through the hierarchy (Requirement 7.2).
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '200':
          description: The restored folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/documents/presign:
    post:
      operationId: presignHierarchyDocumentUpload
      summary: Create a hierarchy document record and presign its upload
      description: >-
        Creates a new HierarchyDocument record under the folder
        identified by the request body's parentId and returns a
        presigned S3 upload URL alongside it, served by
        Folders_Documents_Lambda (Requirement 7.3). Requires the caller
        to hold edit PermissionLevel on parentId, returning an HTTP 403
        Error_Envelope otherwise (Requirement 7.6). Returns HTTP 400 if
        parentId, fileName, or ext is missing or not a non-empty string,
        or if sizeBytes is missing or not a number. This operation
        performs no separate existence check on parentId beyond
        permission resolution, so no distinct 404 case is documented
        for a nonexistent parentId.
      tags:
        - Folders and Hierarchy Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignDocumentRequest'
      responses:
        '201':
          description: >-
            The newly created HierarchyDocument record and its presigned
            upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/documents/{id}:
    get:
      operationId: getHierarchyDocument
      summary: Get a single org-scoped hierarchy document
      description: >-
        Returns the HierarchyDocument identified by id, served by
        Folders_Documents_Lambda (Requirement 7.3). Returns an HTTP 404
        Error_Envelope if no HierarchyDocument record exists for id, or
        if it exists but has already been soft-deleted (its deletedAt
        is set) — a soft-deleted document is treated identically to a
        nonexistent one here. Access is then checked via
        resolveDocumentAccessWithFallback, an attachment-aware access
        check distinct from the standard view/edit PermissionLevel
        tiers used by the other operations in this domain — it
        additionally allows access when the document is reachable as a
        Task attachment. Returns an HTTP 403 Error_Envelope ("Access
        denied") if that access resolution fails.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '200':
          description: The hierarchy document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyDocument'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateHierarchyDocument
      summary: Update or move a hierarchy document
      description: >-
        Updates the HierarchyDocument identified by id, served by
        Folders_Documents_Lambda (Requirement 7.3). Requires the caller
        to hold edit PermissionLevel on id itself — this permission
        check targets the "file" item type rather than the "folder" item
        type used by the Folder operations in this domain — returning an
        HTTP 403 Error_Envelope otherwise (Requirement 7.6). Returns an
        HTTP 404 Error_Envelope if no HierarchyDocument record exists
        for id, or if it exists but has already been soft-deleted. All
        request body fields are optional; only fields provided are
        updated. When parentId is provided and differs from the
        document's current parentId (a move), the caller must
        additionally hold edit PermissionLevel on the new parent folder,
        returning HTTP 403 otherwise.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHierarchyDocumentRequest'
      responses:
        '200':
          description: The updated hierarchy document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyDocument'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteHierarchyDocument
      summary: (Unimplemented) Delete a hierarchy document
      description: >-
        Unconditionally returns HTTP 501, regardless of id or any other
        request input, since this route is not yet implemented
        (Requirement 7.5). The handler performs no permission check and
        no existence check before returning this response — it is
        deliberately not modeled as a functioning soft-delete operation
        with normal error cases, and this HTTP 501 stub is the only
        response this operation documents.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '501':
          description: >-
            Not Implemented. This route is an unconditional stub and
            does not perform a soft delete (Requirement 7.5).
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Not implemented
                    description: >-
                      The literal stub error message returned by this
                      unimplemented route. This is not an ErrorEnvelope:
                      "Not implemented" is not one of ErrorEnvelope's
                      five enumerated error values, and this operation
                      unconditionally returns this exact body regardless
                      of input.
  /api/documents/{id}/restore:
    post:
      operationId: restoreHierarchyDocument
      summary: (Unimplemented) Restore a hierarchy document
      description: >-
        Unconditionally returns HTTP 501, regardless of id or any other
        request input, since this route is not yet implemented
        (Requirement 7.5). The handler performs no permission check and
        no existence check before returning this response — it is
        deliberately not modeled as a functioning restore operation with
        normal error cases, and this HTTP 501 stub is the only response
        this operation documents.
      tags:
        - Folders and Hierarchy Documents
      parameters:
        - $ref: '#/components/parameters/FolderOrDocumentIdParam'
      responses:
        '501':
          description: >-
            Not Implemented. This route is an unconditional stub and
            does not perform a restore (Requirement 7.5).
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Not implemented
                    description: >-
                      The literal stub error message returned by this
                      unimplemented route. This is not an ErrorEnvelope:
                      "Not implemented" is not one of ErrorEnvelope's
                      five enumerated error values, and this operation
                      unconditionally returns this exact body regardless
                      of input.
  /api/gallery-images/presign:
    post:
      operationId: presignGalleryImageUpload
      summary: Presign an S3 upload URL for a new gallery image
      description: >-
        Generates a presigned S3 PUT URL for uploading a new gallery
        image's raw content, served by Gallery_Lambda (Requirement
        8.3). The userId used to scope the resulting S3 key is derived
        exclusively from the caller's access token, never from a
        request parameter (Requirement 8.2). This operation performs
        no ownership or existence check — it does not read or write a
        GalleryImage record, and does not check the caller's current
        gallery image count. Returns HTTP 400 if contentType is not one
        of "image/jpeg", "image/png", "image/webp", or "image/gif", or
        if sizeBytes is not a positive integer, or if sizeBytes exceeds
        10,485,760 bytes (10MB) (Requirement 8.3). On success, both
        imageId and the S3 object key are server-generated, and the
        returned uploadUrl expires exactly 300 seconds (5 minutes)
        after issuance (Requirement 8.3). Creating the actual
        GalleryImage record afterward requires a separate call to
        POST /api/gallery-images using the imageId returned here.
      tags:
        - Gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignGalleryImageUploadRequest'
      responses:
        '200':
          description: >-
            The presigned upload URL and the server-generated imageId
            and S3 key the caller must upload to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignGalleryImageUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/gallery-images:
    post:
      operationId: createGalleryImage
      summary: Create a new gallery image record
      description: >-
        Creates a new GalleryImage record for the caller, served by
        Gallery_Lambda (Requirement 8.1). The userId the record is
        stored under is derived exclusively from the caller's access
        token, never from a request parameter (Requirement 8.2). This
        operation performs no separate existence check beyond the
        imageId-duplication check below — there is no ownership check
        to fail, since the record does not yet exist. Returns HTTP 400
        if imageId or ext is missing or not a non-empty string, if the
        request's imageId already matches an existing gallery image
        belonging to the caller, or if the caller already has 10
        gallery images — the per-caller maximum (Requirement 8.4). On
        success, order is server-assigned as the caller's current
        gallery image count (appending the new image at the end of the
        caller's gallery) and createdAt is server-assigned to the
        current time; neither is client-supplied.
      tags:
        - Gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGalleryImageRequest'
      responses:
        '201':
          description: The newly created gallery image record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryImage'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listGalleryImages
      summary: List the caller's gallery images
      description: >-
        Returns every GalleryImage record belonging to the caller,
        served by Gallery_Lambda (Requirement 8.1). The userId used to
        scope the query is derived exclusively from the caller's access
        token, never from a request parameter (Requirement 8.2), so
        this operation only ever returns images the caller owns; there
        is no ownership-failure case to document. Results are sorted by
        each image's order field in ascending order before being
        returned.
      tags:
        - Gallery
      responses:
        '200':
          description: >-
            The caller's gallery images, sorted by order ascending, in
            an object wrapper.
          content:
            application/json:
              schema:
                type: object
                required:
                  - images
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/GalleryImage'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/gallery-images/{id}:
    get:
      operationId: getGalleryImage
      summary: Get a single gallery image
      description: >-
        Returns the GalleryImage identified by id, served by
        Gallery_Lambda (Requirement 8.1). The userId used to scope the
        lookup is derived exclusively from the caller's access token,
        never from a request parameter (Requirement 8.2). Returns an
        HTTP 404 Error_Envelope if id does not exist at all, or if it
        exists but is owned by a different user — the two cases are
        indistinguishable from the caller's perspective, since the
        lookup is always scoped to the caller's own userId (Requirement
        8.2).
      tags:
        - Gallery
      parameters:
        - $ref: '#/components/parameters/GalleryImageIdParam'
      responses:
        '200':
          description: The gallery image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryImage'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteGalleryImage
      summary: Delete a gallery image
      description: >-
        Deletes the GalleryImage identified by id, served by
        Gallery_Lambda (Requirement 8.1). The userId used to scope the
        lookup is derived exclusively from the caller's access token,
        never from a request parameter (Requirement 8.2). Returns an
        HTTP 404 Error_Envelope if id does not exist at all, or if it
        exists but is owned by a different user — the two cases are
        indistinguishable from the caller's perspective, since the
        lookup is always scoped to the caller's own userId (Requirement
        8.2). On success, both the DynamoDB GalleryImage record and its
        underlying S3 object are deleted, and the response body is
        empty.
      tags:
        - Gallery
      parameters:
        - $ref: '#/components/parameters/GalleryImageIdParam'
      responses:
        '204':
          description: The gallery image and its underlying S3 object were deleted.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/gallery-images/reorder:
    put:
      operationId: reorderGalleryImages
      summary: Reorder the caller's gallery images
      description: >-
        Reassigns the order field of every one of the caller's
        GalleryImage records based on the position of each imageId
        within the request body's imageIds array, served by
        Gallery_Lambda (Requirement 8.1). The userId used to scope the
        caller's existing images is derived exclusively from the
        caller's access token, never from a request parameter
        (Requirement 8.2). Returns HTTP 400 if imageIds is not an array
        of strings, if its length does not exactly match the caller's
        current gallery image count, if it contains a duplicate
        imageId, or if it contains an imageId that does not belong to
        the caller (Requirement 8.5). These mismatch cases are all
        documented as HTTP 400, not HTTP 404, since imageIds is
        validated as a single request-body field rather than as an
        entity-identifying path parameter. On success, every image's
        order value is rewritten together in a single transaction, so
        a partial reorder is never observable.
      tags:
        - Gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderGalleryImagesRequest'
      responses:
        '200':
          description: >-
            The imageIds array in its newly applied order, echoed back
            from the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderGalleryImagesResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/grants:
    post:
      operationId: createGrant
      summary: Create an explicit permission grant
      description: >-
        Creates a new explicit GrantRow granting granteeType/granteeId a
        PermissionEntry level on the target itemType/itemId resource,
        served by Permissions_Lambda (Requirement 10.1). Requires the
        caller to hold `manage` permission on itemType/itemId, returning
        an HTTP 403 Error_Envelope otherwise (Requirement 10.5). Returns
        an HTTP 400 Error_Envelope if itemType, itemId, granteeType,
        granteeId, or level is missing, or if itemType, granteeType, or
        level fails its enum check (Requirement 10.6). Unlike
        `POST /api/permissions/links`, `level` here accepts `deny` in
        addition to the four `PermissionLevel` values (Requirement
        10.4). On success, returns the raw internal GrantRow item with
        HTTP 201.
      tags:
        - Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: The newly created permission grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantRow'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listGrants
      summary: List explicit permission grants on a resource
      description: >-
        Lists every explicit GrantRow on the resource identified by the
        required itemId and itemType query parameters, served by
        Permissions_Lambda (Requirement 10.1). Requires the caller to
        hold `manage` permission on itemType/itemId, returning an HTTP
        403 Error_Envelope otherwise (Requirement 10.5). Returns an HTTP
        400 Error_Envelope if either itemId or itemType is omitted, or
        if itemType fails its enum check (Requirement 10.6). Returns the
        raw internal GrantRow items — including link-type grants created
        by `POST /api/permissions/links` — under a `grants` wrapper
        field with HTTP 200.
      tags:
        - Permissions
      parameters:
        - name: itemId
          in: query
          required: true
          description: >-
            The unique identifier of the resource whose grants are being
            listed.
          schema:
            type: string
        - name: itemType
          in: query
          required: true
          description: The type of resource whose grants are being listed.
          schema:
            type: string
            enum:
              - project
              - folder
              - file
      responses:
        '200':
          description: >-
            Every explicit permission grant on the identified resource,
            in an object wrapper.
          content:
            application/json:
              schema:
                type: object
                required:
                  - grants
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantRow'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/grants/{grantId}:
    delete:
      operationId: deleteGrant
      summary: Delete an explicit permission grant
      description: >-
        Deletes the explicit GrantRow identified by the itemType,
        itemId, granteeType, and granteeId query parameters, served by
        Permissions_Lambda (Requirement 10.1). NOTE: despite the
        {grantId} path parameter present in this route's URL, the
        handler's deleteGrant implementation does not use grantId to
        look up or identify the grant to delete at all — it is accepted
        purely for URL-shape consistency with this route's REST-ful
        pattern, but is otherwise ignored. The four required query
        parameters (itemType, itemId, granteeType, granteeId) are what
        actually identify the grant row's composite key, and must be
        supplied instead. Requires the caller to hold `manage`
        permission on itemType/itemId, returning an HTTP 403
        Error_Envelope otherwise (Requirement 10.5). Returns an HTTP 400
        Error_Envelope if any of the four query parameters is missing,
        or if itemType fails its enum check (Requirement 10.6). On
        success, returns HTTP 204 with an empty body.
      tags:
        - Permissions
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
        - name: itemType
          in: query
          required: true
          description: >-
            The type of resource the grant to delete targets. Required
            because, despite the {grantId} path parameter, this value
            (together with itemId, granteeType, and granteeId) is what
            actually identifies the grant row to delete.
          schema:
            type: string
            enum:
              - project
              - folder
              - file
        - name: itemId
          in: query
          required: true
          description: >-
            The unique identifier of the resource the grant to delete
            targets. Required because, despite the {grantId} path
            parameter, this value (together with itemType, granteeType,
            and granteeId) is what actually identifies the grant row to
            delete.
          schema:
            type: string
        - name: granteeType
          in: query
          required: true
          description: >-
            The type of grantee the grant to delete applies to. Required
            because, despite the {grantId} path parameter, this value
            (together with itemType, itemId, and granteeId) is what
            actually identifies the grant row to delete.
          schema:
            type: string
            enum:
              - user
              - guest
              - link
        - name: granteeId
          in: query
          required: true
          description: >-
            The unique identifier of the grantee the grant to delete
            applies to. Required because, despite the {grantId} path
            parameter, this value (together with itemType, itemId, and
            granteeType) is what actually identifies the grant row to
            delete.
          schema:
            type: string
      responses:
        '204':
          description: The permission grant was deleted.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/effective:
    get:
      operationId: getEffectivePermission
      summary: Get the effective permission a grantee holds on a resource
      description: >-
        Resolves the effective PermissionEntry that granteeId holds on
        the resource identified by the required itemId and itemType
        query parameters, served by Permissions_Lambda (Requirement
        10.2). granteeId is an optional query parameter; when omitted,
        it defaults to the caller's own userId. When granteeId is
        supplied and differs from the caller's own userId, the caller
        must hold `manage` permission on itemType/itemId, returning an
        HTTP 403 Error_Envelope otherwise (Requirement 10.5); when
        granteeId is omitted, or equals the caller's own userId, no
        permission check is performed — a caller can always resolve
        their own effective permission on any resource. Returns an HTTP
        400 Error_Envelope if itemId or itemType is missing, or if
        itemType fails its enum check (Requirement 10.6). Returns the
        resolved EffectivePermissionEntry, or null when no explicit or
        inherited permission resolves for that grantee, under a
        `permission` field with HTTP 200.
      tags:
        - Permissions
      parameters:
        - name: itemId
          in: query
          required: true
          description: >-
            The unique identifier of the resource to resolve the
            effective permission on.
          schema:
            type: string
        - name: itemType
          in: query
          required: true
          description: The type of resource to resolve the effective permission on.
          schema:
            type: string
            enum:
              - project
              - folder
              - file
        - name: granteeId
          in: query
          required: false
          description: >-
            The grantee to resolve the effective permission for.
            Defaults to the caller's own userId when omitted. Supplying
            a value other than the caller's own userId requires the
            caller to hold `manage` permission on itemType/itemId
            (Requirement 10.5).
          schema:
            type: string
      responses:
        '200':
          description: >-
            The resolved effective permission, or null if none resolves,
            in an object wrapper.
          content:
            application/json:
              schema:
                type: object
                required:
                  - permission
                properties:
                  permission:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/EffectivePermissionEntry'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/my-access:
    get:
      operationId: getMyAccess
      summary: List the caller's own effective permissions
      description: >-
        Returns every EffectivePermissionEntry resolved for the
        caller's own userId, served by Permissions_Lambda (Requirement
        10.2). No query parameters are accepted, and no permission
        check beyond bare authentication is performed, since this
        operation only ever returns the caller's own effective
        permissions. Returns the raw internal EffectivePermissionEntry
        items under an `items` wrapper field with HTTP 200.
      tags:
        - Permissions
      responses:
        '200':
          description: >-
            Every effective permission entry resolved for the caller,
            in an object wrapper.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EffectivePermissionEntry'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/links:
    post:
      operationId: createLink
      summary: Create a permission share-link
      description: >-
        Creates a new link-type GrantRow — a share-link — granting level
        access to a server-generated token-bearing grantee on the
        target itemType/itemId resource, served by Permissions_Lambda
        (Requirement 10.3). Requires the caller to hold `manage`
        permission on itemType/itemId, returning an HTTP 403
        Error_Envelope otherwise (Requirement 10.5). Returns an HTTP 400
        Error_Envelope if itemType, itemId, or level is missing, if
        itemType fails its enum check, or if level is not one of view,
        comment, edit, or manage (Requirement 10.6) — unlike
        `POST /api/permissions/grants`, a `deny` value for level is
        rejected here with HTTP 400 rather than accepted (Requirement
        10.4). On success, returns the created GrantRow plus a
        top-level token field (identical to the grant's granteeId) with
        HTTP 201.
      tags:
        - Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: The newly created permission share-link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listLinks
      summary: List permission share-links on a resource
      description: >-
        Lists every link-type GrantRow on the resource identified by
        the required itemId and itemType query parameters, served by
        Permissions_Lambda (Requirement 10.3). Requires the caller to
        hold `manage` permission on itemType/itemId, returning an HTTP
        403 Error_Envelope otherwise (Requirement 10.5). Returns an HTTP
        400 Error_Envelope if either itemId or itemType is omitted, or
        if itemType fails its enum check (Requirement 10.6). Returns the
        raw internal GrantRow items — link-type grants only, excluding
        user/guest-type grants created by
        `POST /api/permissions/grants` — under a `links` wrapper field
        with HTTP 200.
      tags:
        - Permissions
      parameters:
        - name: itemId
          in: query
          required: true
          description: >-
            The unique identifier of the resource whose share-links are
            being listed.
          schema:
            type: string
        - name: itemType
          in: query
          required: true
          description: The type of resource whose share-links are being listed.
          schema:
            type: string
            enum:
              - project
              - folder
              - file
      responses:
        '200':
          description: >-
            Every permission share-link on the identified resource, in
            an object wrapper.
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantRow'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions/links/{token}:
    delete:
      operationId: deleteLink
      summary: Delete a permission share-link
      description: >-
        Deletes the link-type GrantRow identified by the token path
        parameter together with the required itemType and itemId query
        parameters, served by Permissions_Lambda (Requirement 10.3).
        Unlike `DELETE /api/permissions/grants/{grantId}`'s ignored
        grantId path parameter, token here is actually used — combined
        with itemType and itemId — to compute the grant row's composite
        key for deletion. Requires the caller to hold `manage`
        permission on itemType/itemId, returning an HTTP 403
        Error_Envelope otherwise (Requirement 10.5). Returns an HTTP 400
        Error_Envelope if either itemType or itemId is missing, or if
        itemType fails its enum check (Requirement 10.6). On success,
        returns HTTP 204 with an empty body.
      tags:
        - Permissions
      parameters:
        - $ref: '#/components/parameters/PermissionsLinkTokenParam'
        - name: itemType
          in: query
          required: true
          description: The type of resource the share-link to delete targets.
          schema:
            type: string
            enum:
              - project
              - folder
              - file
        - name: itemId
          in: query
          required: true
          description: >-
            The unique identifier of the resource the share-link to
            delete targets.
          schema:
            type: string
      responses:
        '204':
          description: The permission share-link was deleted.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/public/projects/{token}:
    get:
      operationId: getPublicProjectByToken
      summary: Get a shared project's public view via its share token
      description: >-
        The Public_Sharing_Route (Requirement 11.1) — the only operation
        in this entire document that overrides the top-level
        `security: [{bearerAuth: []}]` default with an explicit empty
        `security: []`. No Authorization header is required or validated
        by this route: it is served by Project_Domain_Lambda's
        `getPublicProjectByToken` handler, which performs its own
        in-handler token check instead of relying on the Api_Authorizer.

        The handler looks up the project via a GSI keyed by a hash of
        the supplied `token` path parameter, matched against the
        `shareTokenHash` field set on a `Project` record by
        `PUT /api/projects/{projectId}/share-token` (Requirement 11.2).
        Three distinct conditions are indistinguishable to the caller and
        all collapse to the same HTTP 404 `ErrorEnvelope` response with
        message `"Shared project not found."` (Requirement 11.3):
          1. `token` is empty, missing, or otherwise malformed and fails
             basic non-empty-string validation before any lookup occurs;
          2. no `Project` record's `shareTokenHash` matches the supplied
             `token` at all;
          3. a `Project` record matches the supplied `token`, but that
             record's `shareTokenExpiresAt` timestamp has already passed
             (or is unset).
        There is no way for a caller to distinguish "invalid token" from
        "expired token" from "a token that never existed" from this
        response alone.

        On success (a matching, unexpired `Project`), the route returns
        HTTP 200 with the restricted `PublicProjectView` schema —
        exactly `name`, `description`, `ownerDisplayName`, `milestones`,
        `documentMetadata`, and `teamMemberDisplayNames`
        (Requirement 11.4) — never the full internal `Project` entity
        and never any internal identifier for the project's owner or
        team members.
      security: []
      tags:
        - Public Sharing
      parameters:
        - $ref: '#/components/parameters/ShareTokenParam'
      responses:
        '200':
          description: >-
            The token matched an unexpired Project's shareTokenHash; the
            project's restricted public view is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectView'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Auth0-issued access token. Validated by the Api_Authorizer against the
        Auth0_Tenant's JWKS endpoint (signature), issuer, audience, and
        expiration (Requirement 2.2). Must carry the
        `https://flowlee.com/org_id` and `https://flowlee.com/role` custom
        claims (Requirement 2.3); a token missing either claim, or failing
        any validation step, causes the Api_Authorizer to deny the request
        with HTTP 403 before it reaches any domain Lambda (Requirement 2.5).
  headers:
    DeprecationHeader:
      description: >-
        Present on every response (success or error) from all six
        Documents (Project-Scoped) operations, added unconditionally by
        the Documents_Lambda handler's addDeprecationHeaders wrapper,
        signaling that these routes are deprecated in favor of the
        `/api/folders` and `/api/documents` hierarchy routes served by
        Folders_Documents_Lambda (Requirement 7.1).
      schema:
        type: string
      example: 'true'
    SunsetHeader:
      description: >-
        Present on every response (success or error) from all six
        Documents (Project-Scoped) operations, added unconditionally by
        the Documents_Lambda handler's addDeprecationHeaders wrapper,
        giving the planned sunset date for these deprecated routes
        (Requirement 7.1).
      schema:
        type: string
      example: '2025-12-31'
    LinkHeader:
      description: >-
        Present on every response (success or error) from all six
        Documents (Project-Scoped) operations, added unconditionally by
        the Documents_Lambda handler's addDeprecationHeaders wrapper,
        pointing to the two successor routes clients should migrate to
        (Requirement 7.1).
      schema:
        type: string
      example: >-
        </api/folders>; rel="successor-version",
        </api/documents/presign>; rel="successor-version"
  parameters:
    OrgIdParam:
      name: orgId
      in: path
      required: true
      description: >-
        The unique identifier of the organization that owns the target
        resource.
      schema:
        type: string
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      description: The unique identifier of the target Project.
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      description: >-
        The unique identifier of the target user, matching the `sub` claim
        of that user's Auth0 access token.
      schema:
        type: string
    ClientIdParam:
      name: clientId
      in: path
      required: true
      description: The unique identifier of the target Client.
      schema:
        type: string
    BlockIdParam:
      name: blockId
      in: path
      required: true
      description: The unique identifier of the target TimelineBlock.
      schema:
        type: string
    MilestoneIdParam:
      name: milestoneId
      in: path
      required: true
      description: The unique identifier of the target Milestone.
      schema:
        type: string
    TaskIdParam:
      name: taskId
      in: path
      required: true
      description: The unique identifier of the target Task.
      schema:
        type: string
    DocumentIdParam:
      name: documentId
      in: path
      required: true
      description: >-
        The unique identifier of the target project-scoped Document, served
        by Documents_Lambda.
      schema:
        type: string
    FolderOrDocumentIdParam:
      name: id
      in: path
      required: true
      description: >-
        The unique identifier of the target Folder or org-scoped
        HierarchyDocument, as used by the Folders_Documents_Lambda routes.
      schema:
        type: string
    GalleryImageIdParam:
      name: id
      in: path
      required: true
      description: The unique identifier of the target GalleryImage.
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      description: The unique identifier of the target ConversationSession.
      schema:
        type: string
    MessageIdParam:
      name: messageId
      in: path
      required: true
      description: The unique identifier of the target ChatMessage.
      schema:
        type: string
    GrantIdParam:
      name: grantId
      in: path
      required: true
      description: The unique identifier of the target permission GrantRow.
      schema:
        type: string
    ShareTokenParam:
      name: token
      in: path
      required: true
      description: >-
        The time-limited project share token generated by
        `PUT /api/projects/{projectId}/share-token` and consumed by the
        Public_Sharing_Route (`GET /api/public/projects/{token}`).
      schema:
        type: string
    PermissionsLinkTokenParam:
      name: token
      in: path
      required: true
      description: >-
        The unique token identifying a permission share-link, as created by
        `POST /api/permissions/links`.
      schema:
        type: string
  responses:
    BadRequestError:
      description: >-
        The request body is missing a required field or contains a field
        value that fails schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: ValidationError
            message: The request body is missing a required field or contains an invalid value.
    ForbiddenError:
      description: >-
        The caller is authenticated but is not permitted to perform this
        operation on the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: ForbiddenError
            message: You do not have permission to perform this action.
    NotFoundError:
      description: >-
        The entity identified by the request's path parameter does not
        exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: NotFoundError
            message: The requested resource could not be found.
    ConflictError:
      description: >-
        The request could not be completed because it conflicts with the
        current state of the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: ConflictError
            message: The request conflicts with the current state of the resource.
    InternalError:
      description: >-
        An unhandled internal error occurred while processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: InternalError
            message: An unexpected error occurred while processing the request.
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        The uniform error response shape returned by every jsonResponse-based
        error helper (badRequest, notFound, forbidden, conflict,
        internalError) in apps/api/src/shared/responses.ts.
      required:
        - error
        - message
      additionalProperties: false
      properties:
        error:
          type: string
          description: >-
            The error category, corresponding to an HTTP status code:
            ValidationError (400), NotFoundError (404), ForbiddenError (403),
            ConflictError (409), InternalError (500).
          enum:
            - ValidationError
            - NotFoundError
            - ForbiddenError
            - ConflictError
            - InternalError
        message:
          type: string
          maxLength: 256
          description: A human-readable description of the error.
    ChatSession:
      type: object
      description: >-
        The list-item shape returned by GET /api/chat-sessions, scoped to
        the caller's own userId.
      required:
        - sessionId
        - title
      properties:
        sessionId:
          type: string
          description: The unique identifier of the ConversationSession.
        title:
          type: string
          description: The display title of the ConversationSession.
    ChatSessionDetail:
      type: object
      description: >-
        The detail shape returned by GET /api/chat-sessions/{sessionId},
        including the session's messages ordered from oldest to newest.
      required:
        - sessionId
        - title
        - messages
      properties:
        sessionId:
          type: string
          description: The unique identifier of the ConversationSession.
        title:
          type: string
          description: The display title of the ConversationSession.
        messages:
          type: array
          description: The session's messages, ordered from oldest to newest.
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatMessage:
      type: object
      description: >-
        A persisted chat message, as returned by chat-message read/write
        routes.
      required:
        - messageId
        - role
        - content
        - createdAt
      properties:
        messageId:
          type: string
          description: The unique identifier of the ChatMessage.
        role:
          type: string
          description: The author of the message.
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          description: The non-empty text content of the message.
        attachmentRefs:
          type: array
          description: Optional references to attachments included with the message.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the message was created.
    CreateChatMessageRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/chat-sessions/{sessionId}/messages.
      required:
        - role
        - content
      additionalProperties: false
      properties:
        role:
          type: string
          description: The author of the message.
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          description: The non-empty text content of the message.
        attachmentRefs:
          type: array
          description: Optional references to attachments included with the message.
          items:
            type: string
    Gender:
      type: string
      description: Allowed gender values for a UserProfile.
      enum:
        - male
        - female
        - other
    PhotoReference:
      type: object
      description: >-
        A reference to an uploaded profile photo stored in S3,
        identifying the photo by its photoId and file extension.
      required:
        - photoId
        - ext
      additionalProperties: false
      properties:
        photoId:
          type: string
          description: The unique identifier of the uploaded photo (UUID, alphanumeric + hyphens).
        ext:
          type: string
          description: The file extension of the uploaded photo.
          enum:
            - jpg
            - png
            - webp
            - gif
    UserProfile:
      type: object
      description: >-
        A registered user's profile record, keyed by the userId matching
        the `sub` claim of that user's Auth0 access token. Served by
        Identity_Lambda. A POST /api/users request for a userId that
        already has a UserProfile record unconditionally overwrites the
        existing record (Requirement 4.6, 5.1).
      required:
        - userId
        - email
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
          description: >-
            The unique identifier of the user, matching the `sub` claim of
            that user's Auth0 access token.
        email:
          type: string
          format: email
          description: The user's email address.
        name:
          type: string
          description: The user's optional display name.
        surname:
          type: string
          maxLength: 200
          description: The user's surname.
        gender:
          $ref: '#/components/schemas/Gender'
        birthDate:
          type: string
          format: date
          description: The user's birth date in YYYY-MM-DD format.
        jobTitle:
          type: string
          maxLength: 200
          description: The user's job title.
        photo:
          $ref: '#/components/schemas/PhotoReference'
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the profile was created.
        updatedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which the profile was last updated.
    CreateUserProfileRequest:
      type: object
      description: >-
        The request body accepted by POST /api/users. This route is
        restricted to the caller acting on their own userId, returning an
        HTTP 403 Error_Envelope otherwise (Requirement 4.5, 5.4). A
        request for a userId that already has a UserProfile record
        unconditionally overwrites that record and returns an HTTP 201
        response rather than an HTTP 409 Error_Envelope (Requirement 4.6).
      required:
        - userId
        - email
      additionalProperties: false
      properties:
        userId:
          type: string
          description: >-
            The unique identifier of the user, matching the `sub` claim of
            the caller's own Auth0 access token.
        email:
          type: string
          format: email
          description: The user's email address.
        name:
          type: string
          description: The user's optional display name.
        surname:
          type: string
          maxLength: 200
          description: The user's surname.
        gender:
          $ref: '#/components/schemas/Gender'
        birthDate:
          type: string
          format: date
          description: The user's birth date in YYYY-MM-DD format.
        jobTitle:
          type: string
          maxLength: 200
          description: The user's job title.
    UpdateUserProfileRequest:
      type: object
      description: >-
        The request body accepted by PUT /api/users/{userId}. This route
        is restricted to the caller acting on their own userId, returning
        an HTTP 403 Error_Envelope otherwise (Requirement 5.4). All fields
        are optional; only fields provided in the request body are
        updated.
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: The user's updated email address.
        name:
          type: string
          description: The user's updated display name.
        surname:
          type: string
          maxLength: 200
          description: The user's updated surname.
        gender:
          $ref: '#/components/schemas/Gender'
        birthDate:
          type: string
          format: date
          description: The user's updated birth date in YYYY-MM-DD format.
        jobTitle:
          type: string
          maxLength: 200
          description: The user's updated job title.
        photo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PhotoReference'
          description: >-
            The user's profile photo reference. Set to a PhotoReference object
            to attach a photo, set to null to remove the photo, or omit to
            leave unchanged.
    TeamMember:
      type: object
      description: >-
        An organization-membership record linking a userId to an orgId,
        role, and status. Served by Identity_Lambda. A
        POST /api/orgs/{orgId}/team-members request for a userId that
        already exists as a team member unconditionally overwrites the
        existing record (Requirement 5.2).
      required:
        - orgId
        - userId
        - displayName
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        orgId:
          type: string
          description: The unique identifier of the organization.
        userId:
          type: string
          description: >-
            The unique identifier of the user, matching the `sub` claim of
            that user's Auth0 access token.
        displayName:
          type: string
          description: The team member's display name.
        role:
          type: string
          description: >-
            The team member's role within the organization (e.g. admin).
        status:
          type: string
          description: The team member's membership status (Requirement 5.3).
          enum:
            - active
            - invited
            - suspended
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the record was created.
        updatedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which the record was last updated.
    CreateTeamMemberRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/orgs/{orgId}/team-members. Restricted to callers whose
        token role claim is admin within the target orgId (Requirement
        5.5). A request for a userId that already exists as a team member
        unconditionally overwrites the existing TeamMember record
        (Requirement 5.2).
      required:
        - userId
        - displayName
        - role
      additionalProperties: false
      properties:
        userId:
          type: string
          description: The unique identifier of the user to add as a team member.
        displayName:
          type: string
          description: The team member's display name.
        role:
          type: string
          description: >-
            The team member's role within the organization (e.g. admin).
        status:
          type: string
          description: >-
            The team member's membership status. Defaults to `invited`
            only when this field is omitted from the request body
            (Requirement 4.3, 5.3); the caller may explicitly specify
            `active`, `invited`, or `suspended` instead.
          enum:
            - active
            - invited
            - suspended
          default: invited
    UpdateTeamMemberRequest:
      type: object
      description: >-
        The request body accepted by
        PUT /api/orgs/{orgId}/team-members/{userId}. Restricted to
        callers whose token role claim is admin within the target orgId
        (Requirement 5.5). All fields are optional; only fields provided
        in the request body are updated.
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: The team member's updated display name.
        role:
          type: string
          description: The team member's updated role within the organization.
        status:
          type: string
          description: The team member's updated membership status.
          enum:
            - active
            - invited
            - suspended
    Project:
      type: object
      description: >-
        A project record scoped to an organization, served by
        Project_Domain_Lambda. `shareTokenHash` and `shareTokenExpiresAt`
        are internal fields set by `PUT /api/projects/{projectId}/share-token`
        (Requirement 6.2); the handlers do not strip them from normal CRUD
        responses (create/list/get/update), so they may appear on this
        schema once a share token has been generated for the project. The
        unauthenticated Public_Sharing_Route
        (`GET /api/public/projects/{token}`) never returns this schema —
        it returns the separate, restricted `PublicProjectView` schema
        instead (Requirement 11.4).
      required:
        - orgId
        - projectId
        - name
        - description
        - ownerUserId
        - clientId
        - status
        - createdAt
        - updatedAt
      properties:
        orgId:
          type: string
          description: The unique identifier of the organization that owns the project.
        projectId:
          type: string
          description: The unique identifier of the project.
        name:
          type: string
          description: The project's display name.
        description:
          type: string
          description: A free-text description of the project.
        ownerUserId:
          type: string
          description: The unique identifier of the user who owns the project.
        clientId:
          type: string
          description: The unique identifier of the Client this project is billed to.
        status:
          type: string
          description: The project's current status, as a free-text value.
        shareTokenHash:
          type: string
          description: >-
            Internal only. The hash of the current public share token,
            set by PUT /api/projects/{projectId}/share-token. Not
            intended for client use; present on this schema only because
            the handlers do not strip it from normal CRUD responses.
        shareTokenExpiresAt:
          type: string
          format: date-time
          description: >-
            Internal only. The ISO 8601 expiration timestamp of the
            current public share token, set by
            PUT /api/projects/{projectId}/share-token. The
            Public_Sharing_Route treats a token as invalid once this
            timestamp has passed (Requirement 11.2, 11.3).
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the project was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the project was last updated.
    CreateProjectRequest:
      type: object
      description: >-
        The request body accepted by POST /api/orgs/{orgId}/projects.
        orgId is supplied via the path, and projectId/createdAt/updatedAt
        are server-assigned; none of those fields are part of this
        request schema.
      required:
        - name
        - description
        - ownerUserId
        - clientId
        - status
      additionalProperties: false
      properties:
        name:
          type: string
          description: The project's display name.
        description:
          type: string
          description: A free-text description of the project.
        ownerUserId:
          type: string
          description: The unique identifier of the user who owns the project.
        clientId:
          type: string
          description: The unique identifier of the Client this project is billed to.
        status:
          type: string
          description: The project's initial status, as a free-text value.
    UpdateProjectRequest:
      type: object
      description: >-
        The request body accepted by
        PUT /api/orgs/{orgId}/projects/{projectId}, restricted to callers
        holding the admin role within the organization (Requirement 6.1).
        All fields are optional; only fields provided in the request body
        are updated.
      additionalProperties: false
      properties:
        name:
          type: string
          description: The project's updated display name.
        description:
          type: string
          description: The project's updated free-text description.
        ownerUserId:
          type: string
          description: The updated unique identifier of the project's owner.
        clientId:
          type: string
          description: >-
            The updated unique identifier of the Client this project is
            billed to.
        status:
          type: string
          description: The project's updated status, as a free-text value.
    ShareTokenResponse:
      type: object
      description: >-
        The response body returned by
        PUT /api/projects/{projectId}/share-token, restricted to callers
        holding the admin role within the project's organization. Generates
        a new time-limited token consumed by the Public_Sharing_Route
        (Requirement 6.2).
      required:
        - shareToken
        - shareTokenExpiresAt
      properties:
        shareToken:
          type: string
          description: >-
            The newly generated, unhashed share token. This raw value is
            returned exactly once, at generation time; only its hash is
            persisted server-side as the Project's shareTokenHash.
        shareTokenExpiresAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which the generated share token
            expires (Requirement 6.2).
    TimelineBlock:
      type: object
      description: >-
        A timeline block scoped to a project, served by
        Project_Domain_Lambda. These routes enforce no
        organization-membership or role-based permission check beyond
        bare authentication (Requirement 6.3) — the handler only calls
        resolveAuthContext to validate the caller's token, with no
        isInSameOrg/isAdmin-style check, since TimelineBlock is
        project-scoped by projectId only and carries no orgId of its own.
      required:
        - projectId
        - blockId
        - startAt
        - endAt
        - title
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          description: The unique identifier of the project this block belongs to.
        blockId:
          type: string
          description: The unique identifier of the timeline block.
        assigneeUserId:
          type: string
          description: >-
            The unique identifier of the user assigned to this block, if
            any.
        startAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block starts.
        endAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block ends.
        title:
          type: string
          description: The block's display title.
        status:
          type: string
          description: The block's current status, as a free-text value.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block was last updated.
    CreateTimelineBlockRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/projects/{projectId}/timeline-blocks. projectId is
        supplied via the path, and blockId/createdAt/updatedAt are
        server-assigned; none of those fields are part of this request
        schema. This route enforces no organization-membership or
        role-based permission check beyond bare authentication
        (Requirement 6.3).
      required:
        - startAt
        - endAt
        - title
        - status
      additionalProperties: false
      properties:
        assigneeUserId:
          type: string
          description: >-
            The unique identifier of the user to assign to this block, if
            any.
        startAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block starts.
        endAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the block ends.
        title:
          type: string
          description: The block's display title.
        status:
          type: string
          description: The block's initial status, as a free-text value.
    UpdateTimelineBlockRequest:
      type: object
      description: >-
        The request body accepted by
        PUT /api/projects/{projectId}/timeline-blocks/{blockId}. All
        fields are optional; only fields provided in the request body
        are updated. Setting assigneeUserId to null explicitly unassigns
        the block. This route enforces no organization-membership or
        role-based permission check beyond bare authentication
        (Requirement 6.3).
      additionalProperties: false
      properties:
        assigneeUserId:
          type: string
          nullable: true
          description: >-
            The updated unique identifier of the user assigned to this
            block, or null to unassign it.
        startAt:
          type: string
          format: date-time
          description: The block's updated start timestamp, in ISO 8601 format.
        endAt:
          type: string
          format: date-time
          description: The block's updated end timestamp, in ISO 8601 format.
        title:
          type: string
          description: The block's updated display title.
        status:
          type: string
          description: The block's updated status, as a free-text value.
    Client:
      type: object
      description: >-
        A client record scoped to an organization, served by
        Project_Domain_Lambda. The `isInternal` boolean is the field that
        distinguishes the single-per-org internal client (satisfying the
        intent of Requirement 6.4): at most one Client per orgId may have
        `isInternal: true`. `createClient` rejects a second
        `isInternal: true` client for the same orgId with an HTTP 409
        Error_Envelope, and `deleteClient` rejects any attempt to delete
        the client for which `isInternal` is `true` with an HTTP 403
        Error_Envelope. Creating or updating a client with a `name` that
        matches an existing client's name within the same organization,
        compared case-insensitively, also returns an HTTP 409
        Error_Envelope. Deleting a client that is referenced by an
        existing Project's `clientId` returns an HTTP 409 Error_Envelope.
        These conflict/forbidden response codes are attached to the
        `POST`, `PUT`, and `DELETE` Clients path operations.
      required:
        - orgId
        - clientId
        - name
        - isInternal
        - createdAt
        - updatedAt
      properties:
        orgId:
          type: string
          description: The unique identifier of the organization that owns the client.
        clientId:
          type: string
          description: The unique identifier of the client.
        name:
          type: string
          description: >-
            The client's display name. Duplicate names within the same
            organization, compared case-insensitively, are rejected.
        isInternal:
          type: boolean
          description: >-
            Whether this is the organization's single internal client.
            At most one Client per organization may have this field set
            to true; a create request that would produce a second
            internal client for the same organization is rejected with
            an HTTP 409 Error_Envelope, and a delete request targeting
            the client for which this field is true is rejected with an
            HTTP 403 Error_Envelope.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the client was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the client was last updated.
    CreateClientRequest:
      type: object
      description: >-
        The request body accepted by POST /api/orgs/{orgId}/clients,
        restricted to callers holding the admin role within the
        organization. orgId is supplied via the path, and
        clientId/createdAt/updatedAt are server-assigned; none of those
        fields are part of this request schema. A request specifying a
        `name` that matches an existing client's name within the same
        organization, compared case-insensitively, returns an HTTP 409
        Error_Envelope. A request specifying `isInternal: true` when an
        internal client already exists for the organization also returns
        an HTTP 409 Error_Envelope, since only one internal client is
        permitted per organization.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: The client's display name.
        isInternal:
          type: boolean
          default: false
          description: >-
            Whether this client is the organization's single internal
            client. Defaults to false when omitted from the request
            body, matching the handler's `payload.isInternal === true`
            check pattern. At most one client per organization may set
            this to true.
    UpdateClientRequest:
      type: object
      description: >-
        The request body accepted by
        PUT /api/orgs/{orgId}/clients/{clientId}, restricted to callers
        holding the admin role within the organization. All fields are
        optional; only fields provided in the request body are updated.
        A request that updates `name` to a value matching another
        existing client's name within the same organization, compared
        case-insensitively, returns an HTTP 409 Error_Envelope.
      additionalProperties: false
      properties:
        name:
          type: string
          description: The client's updated display name.
        isInternal:
          type: boolean
          description: >-
            The client's updated internal-client flag. At most one
            client per organization may have this field set to true.
    Milestone:
      type: object
      description: >-
        A milestone scoped to a project, served by Project_Domain_Lambda.
        GET operations on Milestone routes require view permission on
        the project; POST, PATCH, and DELETE operations require edit
        permission (Requirement 6.5). Deleting a milestone that still
        has associated tasks (any Task whose milestoneId matches this
        milestone's milestoneId) returns an HTTP 409 Error_Envelope
        rather than performing the delete, instead of deleting the
        milestone (Requirement 6.5); this 409 response is attached to
        the DELETE /api/projects/{projectId}/milestones/{milestoneId}
        operation.
      required:
        - projectId
        - milestoneId
        - name
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          description: >-
            The unique identifier of the project this milestone belongs
            to.
        milestoneId:
          type: string
          description: The unique identifier of the milestone.
        name:
          type: string
          description: The milestone's display name.
        targetDate:
          type: string
          format: date-time
          description: >-
            The optional ISO 8601 target completion date for the
            milestone.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the milestone was created.
        updatedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which the milestone was last
            updated.
    CreateMilestoneRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/projects/{projectId}/milestones, restricted to callers
        holding edit permission on the project (Requirement 6.5).
        projectId is supplied via the path, and
        milestoneId/createdAt/updatedAt are server-assigned; none of
        those fields are part of this request schema.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The milestone's display name.
        targetDate:
          type: string
          format: date-time
          description: >-
            The optional ISO 8601 target completion date for the
            milestone.
    UpdateMilestoneRequest:
      type: object
      description: >-
        The request body accepted by
        PATCH /api/projects/{projectId}/milestones/{milestoneId},
        restricted to callers holding edit permission on the project
        (Requirement 6.5). All fields are optional; only fields provided
        in the request body are updated. Setting targetDate explicitly
        to null clears the milestone's target date.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The milestone's updated display name.
        targetDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            The milestone's updated target completion date, in ISO 8601
            format, or null to clear it.
    Task:
      type: object
      description: >-
        A task scoped to a project and a milestone, served by
        Project_Domain_Lambda. GET operations on Task routes require
        view permission on the project; PATCH, DELETE, and
        attachment-modifying operations require edit permission, and
        creating a comment requires comment permission (Requirement
        6.6). The dependencies array holds the taskId values of other
        tasks within the same project that this task depends on; both
        task creation and task update reject a dependencies value that
        would introduce a circular dependency with an HTTP 400
        Error_Envelope.
      required:
        - projectId
        - milestoneId
        - taskId
        - title
        - status
        - dependencies
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          description: The unique identifier of the project this task belongs to.
        milestoneId:
          type: string
          description: >-
            The unique identifier of the milestone this task belongs to.
        taskId:
          type: string
          description: The unique identifier of the task.
        title:
          type: string
          description: The task's display title.
        description:
          type: string
          description: An optional free-text description of the task.
        status:
          type: string
          description: The task's current status.
          enum:
            - todo
            - in_progress
            - done
        assigneeUserId:
          type: string
          description: >-
            The unique identifier of the user assigned to this task, if
            any.
        effortHours:
          type: number
          description: >-
            The optional estimated effort, in hours, to complete the
            task.
        dependencies:
          type: array
          description: >-
            The taskId values of other tasks within the same project
            that this task depends on.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the task was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the task was last updated.
    CreateTaskRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/projects/{projectId}/milestones/{milestoneId}/tasks,
        restricted to callers holding edit permission on the project
        (Requirement 6.5). projectId and milestoneId are supplied via
        the path, and taskId/createdAt/updatedAt are server-assigned;
        none of those fields are part of this request schema. status
        defaults to todo when omitted, and dependencies defaults to an
        empty array when omitted or not an array. A dependencies value
        that would introduce a circular dependency is rejected with an
        HTTP 400 Error_Envelope.
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: The task's display title.
        description:
          type: string
          description: An optional free-text description of the task.
        status:
          type: string
          description: The task's initial status. Defaults to todo when omitted.
          enum:
            - todo
            - in_progress
            - done
          default: todo
        assigneeUserId:
          type: string
          description: >-
            The unique identifier of the user to assign to this task, if
            any.
        effortHours:
          type: number
          description: >-
            The optional estimated effort, in hours, to complete the
            task.
        dependencies:
          type: array
          description: >-
            The taskId values of other tasks within the same project
            that this task depends on. Defaults to an empty array when
            omitted.
          items:
            type: string
          default: []
    UpdateTaskRequest:
      type: object
      description: >-
        The request body accepted by
        PATCH /api/projects/{projectId}/tasks/{taskId}, restricted to
        callers holding edit permission on the project (Requirement
        6.6). All fields are optional; only fields provided in the
        request body are updated. Setting description, assigneeUserId,
        or effortHours explicitly to null clears that field. Providing
        milestoneId moves the task to a different milestone within the
        same project; the target milestone must exist or the request
        returns an HTTP 404 Error_Envelope. A dependencies value that
        would introduce a circular dependency is rejected with an HTTP
        400 Error_Envelope.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: The task's updated display title.
        description:
          type: string
          nullable: true
          description: >-
            The task's updated free-text description, or null to clear
            it.
        status:
          type: string
          description: The task's updated status.
          enum:
            - todo
            - in_progress
            - done
        assigneeUserId:
          type: string
          nullable: true
          description: >-
            The updated unique identifier of the user assigned to this
            task, or null to unassign it.
        effortHours:
          type: number
          nullable: true
          description: >-
            The updated estimated effort, in hours, to complete the
            task, or null to clear it.
        dependencies:
          type: array
          description: >-
            The updated taskId values of other tasks within the same
            project that this task depends on.
          items:
            type: string
        milestoneId:
          type: string
          description: >-
            Moves the task to the milestone identified by this value,
            within the same project. The target milestone must already
            exist, or the request returns an HTTP 404 Error_Envelope.
    Comment:
      type: object
      description: >-
        A comment on a task, served by Project_Domain_Lambda. Creating a
        comment requires comment permission on the project; listing
        comments requires view permission (Requirement 6.6).
      required:
        - taskId
        - commentId
        - authorId
        - bodyMarkdown
        - createdAt
      properties:
        taskId:
          type: string
          description: The unique identifier of the task this comment belongs to.
        commentId:
          type: string
          description: The unique identifier of the comment.
        authorId:
          type: string
          description: >-
            The unique identifier of the user who authored the comment,
            derived from the caller's own userId rather than
            client-supplied input.
        bodyMarkdown:
          type: string
          description: The comment's non-empty Markdown-formatted body text.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the comment was created.
        editedAt:
          type: string
          format: date-time
          description: >-
            The optional ISO 8601 timestamp at which the comment was
            last edited.
    CreateCommentRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/projects/{projectId}/tasks/{taskId}/comments,
        restricted to callers holding comment permission on the project
        (Requirement 6.6). taskId is supplied via the path, and
        commentId/createdAt are server-assigned; authorId is derived
        from the caller's own userId rather than accepted from the
        request body, so none of those fields are part of this request
        schema.
      required:
        - bodyMarkdown
      additionalProperties: false
      properties:
        bodyMarkdown:
          type: string
          minLength: 1
          description: The comment's non-empty Markdown-formatted body text.
        attachments:
          type: array
          description: >-
            Optional documentId values of existing project documents to
            attach to the task as part of creating this comment.
          items:
            type: string
    ProjectOverview:
      type: object
      description: >-
        A read-only, computed (non-persisted) per-project summary served
        by Project_Domain_Lambda's insights routes, backing
        GET /api/orgs/{orgId}/insights/project-overviews (Requirement
        6.7). Derived at request time from Project and TimelineBlock
        data by the @flowlee/cognitive-engine package's
        computeProjectOverviews function (apps/cognitive-engine/src/summary.ts),
        which composes forecastProjectTimeline's placeholder forecast
        heuristic (latest endAt among the project's non-terminal
        TimelineBlocks, flagged at-risk once that date has passed).
        This heuristic is a documented starting point in source, not a
        final product-confirmed algorithm, and may change without
        altering this schema's shape.
      required:
        - projectId
        - name
        - status
        - forecastedCompletionAt
        - atRisk
        - activeBlockCount
      properties:
        projectId:
          type: string
          description: The unique identifier of the summarized project.
        name:
          type: string
          description: The project's display name.
        status:
          type: string
          description: The project's current status, as a free-text value.
        forecastedCompletionAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The ISO 8601 timestamp of the latest endAt among the
            project's active (non-terminal-status) TimelineBlocks, or
            null when no active TimelineBlock remains. Computed by the
            placeholder forecast heuristic described above.
        atRisk:
          type: boolean
          description: >-
            True when active TimelineBlocks remain for the project but
            forecastedCompletionAt has already passed at computation
            time, per the placeholder forecast heuristic described
            above.
        activeBlockCount:
          type: integer
          minimum: 0
          description: >-
            The count of TimelineBlocks still active (not in a
            terminal status) for this project.
    ProjectInsightDetail:
      description: >-
        A read-only, computed (non-persisted) deep-dive summary for a
        single project, backing
        GET /api/orgs/{orgId}/projects/{projectId}/insights/detail
        (Requirement 6.7). Returned as the raw object, not wrapped in
        an envelope field. Combines every ProjectOverview field with
        the project's upcoming TimelineBlocks and the cognitive load of
        every member assigned to at least one of the project's
        TimelineBlocks, computed at request time by
        @flowlee/cognitive-engine's computeProjectDetail function
        (apps/cognitive-engine/src/summary.ts). As with ProjectOverview,
        the underlying forecast and workload heuristics are documented
        in source as placeholder starting points, not final
        product-confirmed algorithms.
      allOf:
        - $ref: '#/components/schemas/ProjectOverview'
        - type: object
          required:
            - upcomingBlocks
            - assigneeWorkload
          properties:
            upcomingBlocks:
              type: array
              description: >-
                The project's active TimelineBlocks, sorted by endAt
                ascending (soonest-ending first).
              items:
                $ref: '#/components/schemas/TimelineBlock'
            assigneeWorkload:
              type: array
              description: >-
                The cognitive load of every member with at least one
                TimelineBlock on this project, in the same
                TeamWorkloadEntry shape returned by the team-workload
                insight endpoint.
              items:
                $ref: '#/components/schemas/TeamWorkloadEntry'
    TeamWorkloadEntry:
      type: object
      description: >-
        A read-only, computed (non-persisted) per-member cognitive-load
        summary served by Project_Domain_Lambda's insights routes,
        backing GET /api/orgs/{orgId}/insights/team-workload
        (Requirement 6.7) and reused as the assigneeWorkload entries of
        ProjectInsightDetail. Derived at request time from TeamMember
        and TimelineBlock data by @flowlee/cognitive-engine's
        computeMemberCognitiveLoad function
        (apps/cognitive-engine/src/workload.ts). The loadScore/loadLevel
        thresholds (a 40-hour full-capacity week; moderate at 60% of
        that, high at 100%) are documented in source as a placeholder
        heuristic, not a final product-confirmed algorithm.
      required:
        - userId
        - activeBlockCount
        - totalActiveHours
        - loadScore
        - loadLevel
      properties:
        userId:
          type: string
          description: The unique identifier of the team member this entry summarizes.
        activeBlockCount:
          type: integer
          minimum: 0
          description: >-
            The count of TimelineBlocks assigned to this member that
            are not in a terminal status.
        totalActiveHours:
          type: number
          minimum: 0
          description: >-
            The sum of this member's active TimelineBlocks' durations,
            in hours.
        loadScore:
          type: number
          minimum: 0
          description: >-
            totalActiveHours expressed as a fraction of a 40-hour
            full-capacity week (per the placeholder heuristic described
            above); values at or above 1.0 represent a full week or
            more of active assigned work.
        loadLevel:
          type: string
          description: >-
            A coarse bucket derived from loadScore for quick
            display/sorting, per the placeholder heuristic described
            above.
          enum:
            - low
            - moderate
            - high
    MemberTasksEntry:
      description: >-
        A read-only, computed (non-persisted) response entry backing
        GET /api/orgs/{orgId}/insights/member-tasks/{userId}
        (Requirement 6.7), wrapped as memberTasks in that route's
        response body. This shape is exactly a TimelineBlock, as
        returned by @flowlee/cognitive-engine's getMemberTasks function
        (apps/cognitive-engine/src/shared.ts): the member's own
        TimelineBlocks, sorted by startAt ascending (soonest-starting
        first). No fields are added or removed relative to
        TimelineBlock; this schema exists as a distinctly named alias
        so the insight response can be referenced without implying the
        entity is writable through this route.
      allOf:
        - $ref: '#/components/schemas/TimelineBlock'
    UpcomingDeadlineEntry:
      description: >-
        A read-only, computed (non-persisted) response entry backing
        GET /api/orgs/{orgId}/insights/upcoming-deadlines (Requirement
        6.7), wrapped as upcomingDeadlines in that route's response
        body. This shape is exactly a TimelineBlock, as returned by
        @flowlee/cognitive-engine's getUpcomingDeadlines function
        (apps/cognitive-engine/src/forecasting.ts): active
        (non-terminal-status) TimelineBlocks across the organization
        whose endAt falls within the request's withinDays window of
        the current time, sorted by endAt ascending (soonest-ending
        first). The withinDays query parameter defaults to 14 when
        omitted, must be at least 1, and a value less than or equal to
        0 receives an HTTP 400 response. No fields are added or removed
        relative to TimelineBlock; this schema exists as a distinctly
        named alias so the insight response can be referenced without
        implying the entity is writable through this route.
      allOf:
        - $ref: '#/components/schemas/TimelineBlock'
    OverloadedMemberBottleneck:
      type: object
      description: >-
        One variant of BottleneckEntry: flags a team member whose
        computed cognitive-load level (per TeamWorkloadEntry's
        loadLevel heuristic) is high. This is a deliberately simple,
        documented placeholder heuristic in source
        (apps/cognitive-engine/src/bottlenecks.ts), not a final
        product-confirmed definition of "bottleneck".
      required:
        - type
        - userId
        - loadScore
        - activeBlockCount
      properties:
        type:
          type: string
          enum:
            - overloaded_member
          description: Discriminates this variant of BottleneckEntry.
        userId:
          type: string
          description: The unique identifier of the overloaded team member.
        loadScore:
          type: number
          minimum: 0
          description: >-
            This member's loadScore at computation time, per the same
            placeholder heuristic as TeamWorkloadEntry.loadScore.
        activeBlockCount:
          type: integer
          minimum: 0
          description: >-
            The count of TimelineBlocks assigned to this member that
            are not in a terminal status.
    TimelineConflictBottleneck:
      type: object
      description: >-
        One variant of BottleneckEntry: flags a pair of the same
        member's active TimelineBlocks whose date ranges overlap. This
        is a deliberately simple, documented placeholder heuristic in
        source (apps/cognitive-engine/src/bottlenecks.ts), not a final
        product-confirmed definition of "bottleneck".
      required:
        - type
        - userId
        - blockIdA
        - blockIdB
      properties:
        type:
          type: string
          enum:
            - timeline_conflict
          description: Discriminates this variant of BottleneckEntry.
        userId:
          type: string
          description: >-
            The unique identifier of the member whose TimelineBlocks
            overlap.
        blockIdA:
          type: string
          description: The unique identifier of the first overlapping TimelineBlock.
        blockIdB:
          type: string
          description: The unique identifier of the second overlapping TimelineBlock.
    BottleneckEntry:
      description: >-
        A read-only, computed (non-persisted) response entry backing
        GET /api/orgs/{orgId}/insights/bottlenecks (Requirement 6.7),
        wrapped as bottlenecks in that route's response body. Derived
        at request time from TeamMember and TimelineBlock data by
        @flowlee/cognitive-engine's detectBottlenecks function
        (apps/cognitive-engine/src/bottlenecks.ts), which flags two
        deliberately simple, documented placeholder bottleneck shapes
        (an overloaded member, or a timeline conflict between two of
        the same member's active blocks) — not a final
        product-confirmed definition of "bottleneck". The type field
        discriminates which variant a given entry is.
      oneOf:
        - $ref: '#/components/schemas/OverloadedMemberBottleneck'
        - $ref: '#/components/schemas/TimelineConflictBottleneck'
      discriminator:
        propertyName: type
        mapping:
          overloaded_member: '#/components/schemas/OverloadedMemberBottleneck'
          timeline_conflict: '#/components/schemas/TimelineConflictBottleneck'
    Document:
      type: object
      description: >-
        A project-scoped document record served by Documents_Lambda,
        distinct from the org-scoped HierarchyDocument entity served by
        Folders_Documents_Lambda despite the similar name — the two
        Lambdas own separate DynamoDB item shapes (Requirement 7.1). All
        six Documents (Project-Scoped) routes — POST, GET (list), GET
        (single), PUT, DELETE, and GET .../signed-url — include
        Deprecation, Sunset, and Link response headers on every
        response. A request from a caller outside the project's
        organization receives an HTTP 403 Error_Envelope, a request
        referencing a documentId that does not exist within the
        specified project receives an HTTP 404 Error_Envelope, and a
        POST or PUT request with a body failing schema validation
        receives an HTTP 400 Error_Envelope.
      required:
        - projectId
        - documentId
        - fileName
        - ext
        - thumbnailStatus
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          description: The unique identifier of the project this document belongs to.
        documentId:
          type: string
          description: >-
            The unique identifier of the document. Unlike most entities
            in this API, documentId is client-supplied at creation time
            rather than server-assigned (see CreateDocumentRequest).
        fileName:
          type: string
          description: The document's display file name.
        ext:
          type: string
          description: The document's file extension, without a leading dot.
        thumbnailStatus:
          type: string
          enum:
            - pending
            - ready
            - failed
          description: The processing status of the document's generated thumbnail.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the document was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the document was last updated.
    CreateDocumentRequest:
      type: object
      description: >-
        The request body accepted by
        POST /api/projects/{projectId}/documents. projectId is supplied
        via the path, and createdAt/updatedAt are server-assigned; none
        of those fields are part of this request schema. Unlike the
        server-assigned identifiers used elsewhere in this API,
        documentId is supplied by the client rather than generated by
        the server. A request whose documentId already exists for this
        project returns an HTTP 400 Error_Envelope (BadRequestError) —
        deliberately not an HTTP 409 Conflict — since the handler
        treats a colliding client-supplied documentId as a validation
        failure rather than a state conflict.
      required:
        - documentId
        - fileName
        - ext
      additionalProperties: false
      properties:
        documentId:
          type: string
          minLength: 1
          description: >-
            The client-chosen unique identifier for the new document.
            Must be a non-empty string. A value that already identifies
            an existing document within this project returns HTTP 400,
            not HTTP 409 (see this schema's top-level description).
        fileName:
          type: string
          minLength: 1
          description: The document's display file name. Must be a non-empty string.
        ext:
          type: string
          minLength: 1
          description: >-
            The document's file extension, without a leading dot. Must
            be a non-empty string.
        thumbnailStatus:
          type: string
          enum:
            - pending
            - ready
            - failed
          default: pending
          description: >-
            The initial processing status of the document's thumbnail.
            Defaults to "pending" when the field is omitted from the
            request body.
    UpdateDocumentRequest:
      type: object
      description: >-
        The request body accepted by
        PUT /api/projects/{projectId}/documents/{documentId}. All
        fields are optional; only fields provided in the request body
        are updated. Each field, when provided, is validated with the
        same non-empty-string or enum rules as CreateDocumentRequest's
        corresponding field.
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          description: >-
            The document's updated display file name. Must be a
            non-empty string when provided.
        ext:
          type: string
          minLength: 1
          description: >-
            The document's updated file extension, without a leading
            dot. Must be a non-empty string when provided.
        thumbnailStatus:
          type: string
          enum:
            - pending
            - ready
            - failed
          description: >-
            The document's updated thumbnail processing status, when
            provided.
    Folder:
      type: object
      description: >-
        An org-scoped folder record served by Folders_Documents_Lambda,
        forming a hierarchy of folders and HierarchyDocument entries
        within an organization. Distinct from the project-scoped
        Document entity served by Documents_Lambda despite the similar
        domain — Folder and HierarchyDocument are the two entities of
        the newer hierarchy model (Requirement 7.2). `deletedAt`, when
        present, indicates the folder has been soft-deleted via
        `DELETE /api/folders/{id}` (Requirement 7.4); this is reversible
        via `POST /api/folders/{id}/restore`, which itself returns an
        HTTP 409 Error_Envelope if the folder's parent is still
        soft-deleted ("Parent is still deleted. Restore must happen
        top-down.") — restores must happen top-down through the
        hierarchy. `Folder` routes enforce `view`/`edit` PermissionLevel
        tiers via permission checks, returning an HTTP 403 Error_Envelope
        when the caller's effective permission is insufficient
        (Requirement 7.6).
      required:
        - orgId
        - folderId
        - parentId
        - name
        - createdBy
        - createdAt
        - updatedAt
      properties:
        orgId:
          type: string
          description: The unique identifier of the organization that owns this folder.
        folderId:
          type: string
          description: The unique, server-assigned identifier of the folder.
        parentId:
          type: string
          nullable: true
          description: >-
            The folderId of this folder's parent folder, or null if this
            folder is at the root of the organization's hierarchy.
            Creating or moving a folder to a non-null parentId requires
            edit permission on that parent folder.
        name:
          type: string
          description: The folder's display name.
        projectId:
          type: string
          description: >-
            The unique identifier of the Project this folder was created
            for, when the folder is a project's root folder or one of its
            standard subfolders (e.g. "Task Attachments"). Absent for
            folders created directly by a client via POST /api/folders.
        deletedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which this folder was soft-deleted
            via DELETE /api/folders/{id}, or absent if the folder has not
            been deleted. Reversible via POST /api/folders/{id}/restore
            (Requirement 7.4).
        createdBy:
          type: string
          description: The userId of the caller who created this folder.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the folder was created.
        updatedAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the folder was last updated.
    CreateFolderRequest:
      type: object
      description: >-
        The request body accepted by POST /api/folders. folderId,
        orgId, createdBy, createdAt, and updatedAt are all
        server-assigned and are not part of this request schema; orgId
        is derived from the caller's own access token, never from the
        request body. Specifying a non-null parentId requires the
        caller to hold edit permission on that parent folder, returning
        an HTTP 403 Error_Envelope otherwise.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The new folder's display name. Must be a non-empty string.
        parentId:
          type: string
          nullable: true
          default: null
          description: >-
            The folderId of the parent folder under which to create the
            new folder. Defaults to null (the root of the organization's
            hierarchy) when omitted. When a non-null value is provided,
            the caller must hold edit permission on that parent folder,
            or the request returns an HTTP 403 Error_Envelope.
    UpdateFolderRequest:
      type: object
      description: >-
        The request body accepted by PATCH /api/folders/{id}. All fields
        are optional; only fields provided in the request body are
        updated. Providing parentId moves the folder to a new parent,
        which requires the caller to hold edit permission on the new
        parent folder in addition to edit permission on the folder being
        moved, and is rejected with an HTTP 400 Error_Envelope
        ("Cannot move a folder into its own subtree") if the requested
        parentId is the folder itself or one of its own descendants.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: >-
            The folder's updated display name. Must be a non-empty
            string when provided.
        parentId:
          type: string
          nullable: true
          description: >-
            The folderId of the new parent folder to move this folder
            under, or null to move the folder to the root of the
            organization's hierarchy. Moving requires edit permission on
            the new parent folder, and is rejected with an HTTP 400
            Error_Envelope if it would create a circular reference (the
            new parentId is the folder itself or one of its own
            descendants).
    HierarchyDocument:
      type: object
      description: >-
        An org-scoped document record served by Folders_Documents_Lambda,
        living inside a Folder within an organization's hierarchy.
        Distinct from the project-scoped Document entity served by
        Documents_Lambda despite the similar domain — the two Lambdas own
        separate DynamoDB item shapes (Requirement 7.3). Unlike Folder's
        nullable parentId, every HierarchyDocument must live inside some
        folder, so parentId is required and never null here. `deletedAt`,
        when present on a HierarchyDocument, is set only by internal
        cascade soft-delete when an ancestor Folder is deleted; the
        client-facing `DELETE /api/documents/{id}` and
        `POST /api/documents/{id}/restore` routes that would otherwise
        set or clear it are currently unimplemented and return a literal
        HTTP 501 response rather than a functioning soft-delete/restore
        pair (Requirement 7.5) — clients cannot currently set or clear
        this field themselves through the documented API.
        `HierarchyDocument` routes enforce `view`/`edit` PermissionLevel
        tiers via permission checks, returning an HTTP 403 Error_Envelope
        when the caller's effective permission is insufficient
        (Requirement 7.6).
      required:
        - orgId
        - documentId
        - parentId
        - fileName
        - ext
        - s3Key
        - sizeBytes
        - thumbnailStatus
        - createdBy
        - createdAt
        - updatedAt
      properties:
        orgId:
          type: string
          description: >-
            The unique identifier of the organization that owns this
            document.
        documentId:
          type: string
          description: The unique, server-assigned identifier of the document.
        parentId:
          type: string
          description: >-
            The folderId of the Folder this document lives in. Required
            and never null, unlike Folder's own nullable parentId, since
            every HierarchyDocument must live inside some folder.
        fileName:
          type: string
          description: The document's display file name.
        ext:
          type: string
          description: The document's file extension, without a leading dot.
        s3Key:
          type: string
          description: >-
            The S3 object key at which the document's uploaded content is
            stored.
        sizeBytes:
          type: number
          description: The size of the uploaded document, in bytes.
        thumbnailStatus:
          type: string
          enum:
            - pending
            - ready
            - failed
          description: >-
            The processing status of the document's generated thumbnail.
            Always set to "pending" server-side at creation time
            (see PresignDocumentRequest); never client-provided.
        deletedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which this document was
            soft-deleted, set only as a side effect of an ancestor
            Folder's cascade soft-delete. The client-facing
            DELETE /api/documents/{id} and POST /api/documents/{id}/restore
            routes are currently unimplemented HTTP 501 stubs
            (Requirement 7.5) and do not set or clear this field.
        createdBy:
          type: string
          description: The userId of the caller who created this document.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the document was created.
        updatedAt:
          type: string
          format: date-time
          description: >-
            The ISO 8601 timestamp at which the document was last
            updated.
    PresignDocumentRequest:
      type: object
      description: >-
        The request body accepted by POST /api/documents/presign.
        documentId, s3Key, thumbnailStatus, createdBy, createdAt, and
        updatedAt are all server-assigned and are not part of this
        request schema; thumbnailStatus is always set to "pending"
        server-side, never client-provided. Requires the caller to hold
        edit permission on parentId, returning an HTTP 403 Error_Envelope
        otherwise.
      required:
        - parentId
        - fileName
        - ext
        - sizeBytes
      additionalProperties: false
      properties:
        parentId:
          type: string
          description: >-
            The folderId of the Folder to create the new document in.
            The caller must hold edit permission on this folder, or the
            request returns an HTTP 403 Error_Envelope.
        fileName:
          type: string
          minLength: 1
          description: The new document's display file name. Must be a non-empty string.
        ext:
          type: string
          minLength: 1
          description: >-
            The new document's file extension, without a leading dot.
            Must be a non-empty string.
        sizeBytes:
          type: number
          description: The size, in bytes, of the file the caller intends to upload.
    PresignDocumentResponse:
      type: object
      description: >-
        The HTTP 201 response body returned by
        POST /api/documents/presign. Wraps the newly created
        HierarchyDocument record alongside a presigned S3 upload URL,
        rather than returning the HierarchyDocument alone, since the
        caller still needs to perform the actual upload after this call
        completes.
      required:
        - uploadUrl
        - document
      properties:
        uploadUrl:
          type: string
          description: >-
            A presigned S3 URL the caller must PUT the file's raw content
            to in order to complete the upload.
        document:
          $ref: '#/components/schemas/HierarchyDocument'
    UpdateHierarchyDocumentRequest:
      type: object
      description: >-
        The request body accepted by PATCH /api/documents/{id}. All
        fields are optional; only fields provided in the request body
        are updated. Providing parentId moves the document to a new
        folder, which requires the caller to hold edit permission on the
        new parent folder in addition to edit permission on the document
        being moved.
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          description: >-
            The document's updated display file name. Must be a
            non-empty string when provided.
        parentId:
          type: string
          description: >-
            The folderId of the new Folder to move this document into.
            Moving requires edit permission on the new parent folder, in
            addition to edit permission on the document itself.

    GalleryImage:
      type: object
      description: >-
        A single image in the caller's personal gallery, served by
        Gallery_Lambda. Every gallery-image route derives the userId
        used to scope access from the caller's own access token, never
        from a request parameter or path parameter (Requirement 8.2); a
        GET /api/gallery-images/{id} or DELETE /api/gallery-images/{id}
        request referencing an id owned by another user, or that does
        not exist at all, returns an indistinguishable HTTP 404
        Error_Envelope in both cases (Requirement 8.2).
      required:
        - userId
        - imageId
        - ext
        - order
        - createdAt
      properties:
        userId:
          type: string
          description: >-
            The unique identifier of the user who owns this image,
            matching the `sub` claim of that user's Auth0 access token.
            Always derived from the caller's own token; never accepted
            as a request parameter (Requirement 8.2).
        imageId:
          type: string
          description: >-
            The unique identifier of the image. Client-supplied at
            creation time via POST /api/gallery-images, rather than
            server-assigned (see CreateGalleryImageRequest).
        ext:
          type: string
          description: >-
            The image's file extension, without a leading dot (e.g.
            "jpg", "png", "webp", "gif"), client-supplied at creation
            time.
        order:
          type: integer
          minimum: 0
          description: >-
            The zero-based display position of the image within the
            caller's gallery (Requirement 8.1). Always server-assigned:
            POST /api/gallery-images appends a new image at the end of
            the caller's gallery by setting order to the caller's
            current gallery image count, and
            PUT /api/gallery-images/reorder is the only route that
            changes existing images' order values, based on the
            position of each imageId within the request's imageIds
            array.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which the image was created.
    CreateGalleryImageRequest:
      type: object
      description: >-
        The request body accepted by POST /api/gallery-images. userId
        is always derived from the caller's own access token and is
        never client-supplied (Requirement 8.2); order is server-assigned
        as the caller's current gallery image count, appending the new
        image at the end of the caller's gallery, and createdAt is also
        server-assigned. None of those three fields are part of this
        request schema. Returns an HTTP 400 Error_Envelope if the caller
        already has 10 gallery images, or if the request's imageId
        matches an existing gallery image's imageId for the caller
        (Requirement 8.4).
      required:
        - imageId
        - ext
      additionalProperties: false
      properties:
        imageId:
          type: string
          minLength: 1
          description: >-
            The client-chosen unique identifier for the new image. Must
            be a non-empty string. A value that already identifies an
            existing gallery image belonging to the caller returns an
            HTTP 400 Error_Envelope rather than creating a duplicate
            (Requirement 8.4).
        ext:
          type: string
          minLength: 1
          description: >-
            The image's file extension, without a leading dot. Must be
            a non-empty string.
    PresignGalleryImageUploadRequest:
      type: object
      description: >-
        The request body accepted by POST /api/gallery-images/presign,
        used to obtain a presigned S3 upload URL for a gallery image
        before the image record itself is created via
        POST /api/gallery-images (Requirement 8.3).
      required:
        - contentType
        - sizeBytes
      additionalProperties: false
      properties:
        contentType:
          type: string
          description: >-
            The MIME type of the image the caller intends to upload.
            Must be one of the four supported gallery image content
            types (Requirement 8.3).
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: >-
            The declared size, in bytes, of the file the caller intends
            to upload. Must be a positive integer no greater than
            10,485,760 (10MB); a larger declared size returns an HTTP
            400 Error_Envelope (Requirement 8.3).
    PresignGalleryImageUploadResponse:
      type: object
      description: >-
        The HTTP 200 response body returned by
        POST /api/gallery-images/presign. Both imageId and key (the S3
        object key the caller must upload to) are server-generated by
        this operation; the caller does not choose either value here,
        even though imageId is later client-supplied as a path
        parameter-free request field when creating the actual
        GalleryImage record via POST /api/gallery-images.
      required:
        - imageId
        - key
        - uploadUrl
        - contentType
        - sizeBytes
        - expiresIn
      properties:
        imageId:
          type: string
          description: >-
            The server-generated unique identifier for the prospective
            image, for later use as the imageId field of a
            POST /api/gallery-images request.
        key:
          type: string
          description: >-
            The server-generated S3 object key the caller must upload
            the file's raw content to.
        uploadUrl:
          type: string
          description: >-
            The presigned S3 URL the caller must PUT the file's raw
            content to, at the given key, in order to complete the
            upload.
        contentType:
          type: string
          description: >-
            The MIME type echoed back from the request, one of the four
            supported gallery image content types.
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: The declared upload size, in bytes, echoed back from the request.
        expiresIn:
          type: integer
          description: >-
            The number of seconds after issuance until uploadUrl
            expires. Always exactly 300 (5 minutes) — a fixed constant
            (GALLERY_PRESIGN_EXPIRES_IN_SECONDS), not a per-request
            value (Requirement 8.3).
          example: 300
    PresignProfilePhotoUploadRequest:
      type: object
      description: >-
        The request body accepted by POST /api/users/{userId}/photo/presign.
      required:
        - contentType
        - sizeBytes
      additionalProperties: false
      properties:
        contentType:
          type: string
          description: The MIME type of the photo to upload.
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: >-
            The declared size, in bytes, of the file to upload. Must be a
            positive integer no greater than 10,485,760 (10MB).
    PresignProfilePhotoUploadResponse:
      type: object
      description: >-
        The HTTP 200 response body returned by
        POST /api/users/{userId}/photo/presign.
      required:
        - photoId
        - key
        - uploadUrl
        - contentType
        - sizeBytes
        - expiresIn
      properties:
        photoId:
          type: string
          description: The server-generated unique identifier for the photo.
        key:
          type: string
          description: The S3 object key the caller must upload the file to.
        uploadUrl:
          type: string
          description: The presigned S3 URL for uploading the photo.
        contentType:
          type: string
          description: The MIME type echoed back from the request.
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: The declared upload size echoed back from the request.
        expiresIn:
          type: integer
          description: >-
            The number of seconds until the upload URL expires. Always 300
            (5 minutes).
          example: 300
    ReorderGalleryImagesRequest:
      type: object
      description: >-
        The request body accepted by PUT /api/gallery-images/reorder,
        specifying the caller's gallery images' imageId values in their
        new desired display order; the position of each imageId within
        this array becomes that image's new order value. Returns an
        HTTP 400 Error_Envelope if the number of imageId values
        provided does not match the caller's current gallery image
        count, if the provided imageId values contain a duplicate, or
        if a provided imageId does not belong to the caller (Requirement
        8.5).
      required:
        - imageIds
      additionalProperties: false
      properties:
        imageIds:
          type: array
          description: >-
            The caller's gallery image imageId values, in their new
            desired display order. Must exactly match the count of the
            caller's existing gallery images, with no duplicate and no
            foreign (non-caller-owned) imageId (Requirement 8.5).
          items:
            type: string
    ReorderGalleryImagesResponse:
      type: object
      description: >-
        The HTTP 200 response body returned by
        PUT /api/gallery-images/reorder, echoing back the imageIds array
        in its newly applied order.
      required:
        - imageIds
      properties:
        imageIds:
          type: array
          description: >-
            The caller's gallery image imageId values, in the order now
            applied to each image's order field.
          items:
            type: string
    PermissionLevel:
      type: string
      description: >-
        The ordered permission-level hierarchy used throughout the
        Permissions_Lambda routes: view < comment < edit < manage, per the
        `PermissionLevel` type in `packages/shared-types/src/index.ts`
        (Requirement 10.4). Used standalone by the `level` field of
        `CreateLinkRequest` (`POST /api/permissions/links`), which rejects
        a `deny` value with an HTTP 400 Error_Envelope, unlike
        `POST /api/permissions/grants` — see `PermissionEntry`.
      enum:
        - view
        - comment
        - edit
        - manage
    PermissionEntry:
      description: >-
        `PermissionLevel` extended with an additional `deny` literal, per
        the `PermissionEntry` type in `packages/shared-types/src/index.ts`.
        Modeled as `oneOf` against `PermissionLevel` plus a `deny`-only
        enum rather than `allOf`, because an `allOf` intersection of the
        four-value `PermissionLevel` enum with a `deny`-only enum would be
        unsatisfiable (the two enums share no member); `oneOf` is the
        cleanest valid OpenAPI 3.0 way to express "PermissionLevel, plus
        one more literal value". Used for `GrantRow.level` and
        `EffectivePermissionEntry.level`, both of which accept `deny`
        (Requirement 10.4), unlike the plain `PermissionLevel` schema used
        by `CreateLinkRequest.level`.
      oneOf:
        - $ref: '#/components/schemas/PermissionLevel'
        - type: string
          enum:
            - deny
    GrantRow:
      type: object
      description: >-
        A single explicit permission grant row, served by
        Permissions_Lambda and matching the `GrantRow` interface in
        `packages/shared-types/src/index.ts` (Requirement 10.1). Returned
        as the raw internal DynamoDB item by `POST /api/permissions/grants`
        and by `GET /api/permissions/grants` — including the internal
        `pk`, `sk`, `gsi1pk`, and `gsi1sk` keys, since the handler returns
        the full internal item rather than a client-friendly subset. This
        schema documents those internal fields as present, per this
        contract's documentation-accuracy principle, rather than omitting
        them.
      required:
        - pk
        - sk
        - gsi1pk
        - gsi1sk
        - itemType
        - itemId
        - granteeType
        - granteeId
        - level
        - explicit
        - createdBy
        - createdAt
      properties:
        pk:
          type: string
          description: >-
            The internal DynamoDB partition key for this grant row.
            Present on the raw item returned by the handler; not intended
            for client interpretation.
        sk:
          type: string
          description: >-
            The internal DynamoDB sort key for this grant row. Present on
            the raw item returned by the handler; not intended for client
            interpretation.
        gsi1pk:
          type: string
          description: >-
            The internal GSI1 partition key for this grant row. Present
            on the raw item returned by the handler; not intended for
            client interpretation.
        gsi1sk:
          type: string
          description: >-
            The internal GSI1 sort key for this grant row. Present on the
            raw item returned by the handler; not intended for client
            interpretation.
        itemType:
          type: string
          description: The type of resource this grant targets.
          enum:
            - project
            - folder
            - file
        itemId:
          type: string
          description: The unique identifier of the resource this grant targets.
        granteeType:
          type: string
          description: The type of grantee this grant applies to.
          enum:
            - user
            - guest
            - link
        granteeId:
          type: string
          description: >-
            The unique identifier of the grantee. For a `link`-type grant,
            as created by `POST /api/permissions/links`, this value is the
            share-link token itself.
        level:
          $ref: '#/components/schemas/PermissionEntry'
        explicit:
          type: boolean
          enum:
            - true
          description: >-
            Always `true` for a GrantRow; distinguishes an explicit grant
            from an inherited effective permission (see
            EffectivePermissionEntry.explicit).
        createdBy:
          type: string
          description: >-
            The `userId` of the caller who created this grant, matching
            the `sub` claim of that caller's Auth0 access token.
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which this grant was created.
    CreateGrantRequest:
      type: object
      description: >-
        The request body accepted by `POST /api/permissions/grants`.
        Requires the caller to hold `manage` permission on the target
        resource, returning an HTTP 403 Error_Envelope otherwise
        (Requirement 10.5). Unlike `CreateLinkRequest`, `level` here
        accepts `deny` in addition to the four `PermissionLevel` values
        (Requirement 10.4).
      required:
        - itemType
        - itemId
        - granteeType
        - granteeId
        - level
      additionalProperties: false
      properties:
        itemType:
          type: string
          description: The type of resource to grant permission on.
          enum:
            - project
            - folder
            - file
        itemId:
          type: string
          description: The unique identifier of the resource to grant permission on.
        granteeType:
          type: string
          description: The type of grantee receiving this grant.
          enum:
            - user
            - guest
            - link
        granteeId:
          type: string
          description: The unique identifier of the grantee receiving this grant.
        level:
          $ref: '#/components/schemas/PermissionEntry'
    EffectivePermissionEntry:
      type: object
      description: >-
        A resolved effective permission entry, served by
        Permissions_Lambda (Requirement 10.2). `GET /api/permissions/my-access`
        returns an array of these as raw internal DynamoDB items under an
        `items` field, including the internal `pk`, `sk`, `gsi1pk`, and
        `gsi1sk` keys, matching the `EffectivePermissionEntry` interface in
        `packages/shared-types/src/index.ts`. `GET /api/permissions/effective`
        returns a single nullable value of this same general shape under a
        `permission` field; the exact field-for-field wire shape produced
        by the underlying `resolveEffectivePermission` helper is not
        confirmed against this schema, since that helper's return type is
        defined outside `apps/api/src/permissions/handler.ts` — this
        schema is modeled on the public `EffectivePermissionEntry`
        interface as the best available approximation.
      required:
        - pk
        - sk
        - gsi1pk
        - gsi1sk
        - level
        - type
        - explicit
        - inheritedFrom
        - lastUpdated
      properties:
        pk:
          type: string
          description: >-
            The internal DynamoDB partition key for this effective
            permission entry. Present on the raw items returned by
            `GET /api/permissions/my-access`; not intended for client
            interpretation.
        sk:
          type: string
          description: >-
            The internal DynamoDB sort key for this effective permission
            entry. Present on the raw items returned by
            `GET /api/permissions/my-access`; not intended for client
            interpretation.
        gsi1pk:
          type: string
          description: >-
            The internal GSI1 partition key for this effective permission
            entry. Present on the raw items returned by
            `GET /api/permissions/my-access`; not intended for client
            interpretation.
        gsi1sk:
          type: string
          description: >-
            The internal GSI1 sort key for this effective permission
            entry. Present on the raw items returned by
            `GET /api/permissions/my-access`; not intended for client
            interpretation.
        level:
          $ref: '#/components/schemas/PermissionEntry'
        type:
          type: string
          description: >-
            Whether this effective permission resolves to an active grant
            or an explicit deny.
          enum:
            - grant
            - deny
        explicit:
          type: boolean
          description: >-
            Whether this effective permission comes from an explicit
            GrantRow on the target resource itself, as opposed to being
            inherited from an ancestor resource.
        inheritedFrom:
          type: string
          nullable: true
          description: >-
            The identifier of the ancestor resource this permission was
            inherited from, or `null` when the permission is explicit
            rather than inherited.
        lastUpdated:
          type: string
          format: date-time
          description: The ISO 8601 timestamp at which this entry was last updated.
    CreateLinkRequest:
      type: object
      description: >-
        The request body accepted by `POST /api/permissions/links`.
        Requires the caller to hold `manage` permission on the target
        resource, returning an HTTP 403 Error_Envelope otherwise
        (Requirement 10.5). Unlike `CreateGrantRequest`, `level` here is
        restricted to the four `PermissionLevel` values; a `deny` value is
        rejected with an HTTP 400 Error_Envelope (Requirement 10.4).
      required:
        - itemType
        - itemId
        - level
      additionalProperties: false
      properties:
        itemType:
          type: string
          description: The type of resource to create a share-link for.
          enum:
            - project
            - folder
            - file
        itemId:
          type: string
          description: >-
            The unique identifier of the resource to create a share-link
            for.
        level:
          $ref: '#/components/schemas/PermissionLevel'
    CreateLinkResponse:
      description: >-
        The HTTP 201 response body returned by
        `POST /api/permissions/links`. Modeled via `allOf` as the full
        GrantRow shape plus a top-level `token` field, since the handler
        returns `{token, ...grantRow}`: for a link-type grant, `granteeId`
        and `token` carry the same server-generated value, and `token` is
        additionally duplicated at the top level of this response for
        caller convenience.
      allOf:
        - $ref: '#/components/schemas/GrantRow'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              description: >-
                The server-generated share-link token, identical to this
                grant's `granteeId`. Used as the `{token}` path parameter
                for `DELETE /api/permissions/links/{token}`, and consumed
                by the Public_Sharing_Route's project-sharing validation
                flow when the underlying `itemType` is a project.

    PublicProjectView:
      type: object
      description: >-
        The HTTP 200 response schema for the unauthenticated
        `GET /api/public/projects/{token}` Public_Sharing_Route. Declares
        exactly these six fields, deliberately excluding any internal
        identifier for the project's owner or team members — e.g.
        `projectId`, `orgId`, or `ownerUserId` — so that no such
        identifier is ever exposed to an unauthenticated caller
        (Requirement 11.4). `additionalProperties: false` makes this
        exclusion durable: a future change that accidentally adds an
        internal identifier to the handler's response object would
        require a visible schema change here to be reflected in this
        contract.
      required:
        - name
        - description
        - ownerDisplayName
        - milestones
        - documentMetadata
        - teamMemberDisplayNames
      additionalProperties: false
      properties:
        name:
          type: string
          description: The project's display name.
        description:
          type: string
          description: The project's free-text description.
        ownerDisplayName:
          type: string
          description: >-
            Intended to be the project owner's resolved display name, but
            owner display-name resolution is not yet implemented: the
            current handler always returns the literal placeholder value
            `"Unknown"` for this field, regardless of who the project's
            actual owner is.
        milestones:
          type: array
          description: >-
            The project's TimelineBlocks, queried live from the database
            at request time — unlike documentMetadata and
            teamMemberDisplayNames below, this field reflects real,
            currently-persisted data.
          items:
            $ref: '#/components/schemas/TimelineBlock'
        documentMetadata:
          type: array
          description: >-
            Intended to hold metadata about the project's documents, but
            document-metadata resolution is not yet implemented: the
            current handler always returns an empty array for this field.
          items: {}
        teamMemberDisplayNames:
          type: array
          description: >-
            Intended to hold the resolved display names of the project's
            team members, but team-member display-name resolution is not
            yet implemented: the current handler always returns an empty
            array for this field.
          items:
            type: string
