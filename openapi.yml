  /api/projects/{projectId}/tasks/{taskId}/attachments:
    post:
      operationId: attachDocument
      summary: Attach a document to a task
      description: >-
        Creates an attachment join item linking the Document identified
        by the request's `documentId` to the Task identified by taskId
        within projectId. Restricted to callers holding edit permission
        on the project; otherwise returns an HTTP 403 Error_Envelope
        (Requirement 6.6). Returns HTTP 400 if the request body is not
        valid JSON or `documentId` is missing or is not a non-empty
        string. Returns HTTP 201 with the created join item on success;
        no dedicated component schema exists for this shape (Requirement
        6.6).
      tags:
        - Milestones and Tasks
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                The request body accepted by
                POST /api/projects/{projectId}/tasks/{taskId}/attachments,
                restricted to callers holding edit permission on the
                project (Requirement 6.6).
              required:
                - documentId
              additionalProperties: false
              properties:
                documentId:
                  type: string
                  minLength: 1
                  description: >-
                    The unique identifier of the existing project-scoped
                    Document to attach to the task.
      responses:
        '201':
          description: The created attachment join item.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  A task-to-document attachment join item. No dedicated
                  component schema exists for this shape (Requirement
                  6.6).
                required:
                  - taskId
                  - documentId
                  - projectId
                  - attachedBy
                  - attachedAt
                properties:
                  taskId:
                    type: string
                    description: >-
                      The unique identifier of the task the document is
                      attached to.
                  documentId:
                    type: string
                    description: >-
                      The unique identifier of the attached
                      project-scoped Document.
                  projectId:
                    type: string
                    description: >-
                      The unique identifier of the project the task
                      belongs to.
                  attachedBy:
                    type: string
                    description: >-
                      The unique identifier of the user who created the
                      attachment.
                  attachedAt:
                    type: string
                    format: date-time
                    description: >-
                      The ISO 8601 timestamp at which the attachment was
                      created.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/tasks/{taskId}/attachments/{documentId}:
    delete:
      operationId: detachDocument
      summary: Detach a document from a task
      description: >-
        Deletes the attachment join item linking the Document identified
        by documentId to the Task identified by taskId within projectId.
        Restricted to callers holding edit permission on the project;
        otherwise returns an HTTP 403 Error_Envelope (Requirement 6.6).
        The underlying delete is unconditional and idempotent — the
        handler never checks whether the attachment exists before
        deleting it, so no HTTP 404 response is documented for this
        operation, unlike other entity-scoped path parameters in this
        domain. Returns HTTP 204 with no response body on success,
        whether or not the attachment previously existed.
      tags:
        - Milestones and Tasks
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/DocumentIdParam'
      responses:
        '204':
          description: No Content. The attachment was removed.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
